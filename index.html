    body { font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .rain-drop {
      position: absolute;
      background: linear-gradient(transparent, rgba(255, 255, 255, 0.75));
      width: 1.5px;
      height: 14px;
      animation: fall linear infinite;
      pointer-events: none;
    }
    @keyframes fall {
      0% { transform: translateY(-20px) translateX(0); opacity: 0; }
      20% { opacity: 0.85; }
      100% { transform: translateY(540px) translateX(-15px); opacity: 0.2; }
    }

    @keyframes bubbleFloat {
      0%, 100% { transform: translate(-50%, -100%) translateY(0px); }
      50% { transform: translate(-50%, -100%) translateY(-4px); }
    }
    .speech-bubble-3d {
      animation: bubbleFloat 3.5s ease-in-out infinite;
    }

    #three-canvas-wrapper canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      outline: none;
      cursor: grab;
    }
    #three-canvas-wrapper canvas:active {

    }

  <!-- 學生登山履歷手冊 Modal -->
  <div id="student-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">

  <script>
    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyUJjAYpBxqx7CJHAEil7-BJtnU_4D9R0MS0Cli6SeNDxLeBp60PZ-L_nCii1breC22bQ/exec";

    const CERT_DATABASE = [
      { id: 'c1', name: '金融市場常識與職業道德', meters: 200 },
      { id: 'c2', name: 'TBSA商務企劃初階', meters: 200 },
      { id: 'c3', name: '生成式AI', meters: 200 },
      { id: 'c4', name: '生成式AI辦公室應用能力認證', meters: 250 },
      { id: 'c5', name: '永續發展基礎能力測驗', meters: 250 },
      { id: 'c6', name: '企業化永續管理師合格證書-碳盤查', meters: 350 },
      { id: 'c7', name: '企業化永續管理師合格證書-永續報告書', meters: 350 },
      { id: 'b1', name: '信託業務人員', meters: 200 },
      { id: 'b2', name: '銀行內控與內稽', meters: 200 },
      { id: 'b3', name: '票券商業務人員', meters: 250 },
      { id: 'b4', name: '初階授信人員專業能力測驗', meters: 300 },
      { id: 'b5', name: '初階外匯人員專業能力測驗', meters: 300 },
      { id: 'b6', name: '外匯交易專業能力測驗', meters: 350 },
      { id: 'b7', name: '理財規劃人員專業能力測驗', meters: 300 },
      { id: 'b8', name: '金融人員風險管理專業能力測驗', meters: 400 },
      { id: 'b9', name: '金融人員授信擔保品估價專業能力測驗', meters: 350 },
      { id: 'b10', name: '債權委外催收測驗', meters: 200 },
      { id: 's1', name: '證券商業務人員', meters: 200 },
      { id: 's2', name: '證券商高級業務人員', meters: 350 },
      { id: 's3', name: '期貨商業務員', meters: 250 },
      { id: 's4', name: '投信投顧業務員', meters: 250 },
      { id: 's5', name: '投信投顧法規乙科', meters: 200 },
      { id: 's6', name: '衍生性金融商品銷售人員資格測驗', meters: 350 },
      { id: 's7', name: '企業內部控制', meters: 200 },
      { id: 's8', name: '債券人員', meters: 300 },
      { id: 's9', name: '資產證券化', meters: 300 },
      { id: 's10', name: '證券投資分析人員', meters: 800 },
      { id: 's11', name: '期貨交易分析人員', meters: 800 },
      { id: 'i1', name: '人身保險業務員', meters: 200 },
      { id: 'i2', name: '財產保險業務員', meters: 200 },
      { id: 'i3', name: '投資型保險商品業務員', meters: 250 },
      { id: 'i4', name: '人身保險業務員銷售外幣收付非投資型保險商品', meters: 250 },
      { id: 'i5', name: '人壽保險核保理賠人員', meters: 400 },
      { id: 'i6', name: '財產保險核保理賠人員', meters: 400 },
      { id: 'l1', name: '多益', meters: 300 },
      { id: 'l2', name: '托福', meters: 500 },
      { id: 'l3', name: '雅思', meters: 500 }
    ];

    function getCertPoints(rawName) {
      if (!rawName) return 200;
      const s = String(rawName).trim();
      const direct = CERT_DATABASE.find(c => c.name === s);
      if (direct) return direct.meters;
      if (s.includes('分析人員') || s.includes('分析師')) return 800;
      if (s.includes('托福') || s.includes('雅思')) return 500;
      if (s.includes('核保') || s.includes('風險管理')) return 400;
      if (s.includes('外匯') || s.includes('授信') || s.includes('衍生性') || s.includes('高業') || s.includes('高級') || s.includes('多益') || s.includes('碳盤查') || s.includes('永續報告書')) return 350;
      if (s.includes('期貨') || s.includes('投信') || s.includes('投資型') || s.includes('外幣') || s.includes('理財規劃') || s.includes('永續發展') || s.includes('AI辦公室') || s.includes('票券')) return 250;
      return 200;
    }

    function calculateStudentAltitude(certs) {
      if (!certs || !Array.isArray(certs) || certs.length === 0) return 0;
      let total = 0;
      certs.forEach(c => { total += getCertPoints(c.name); });
      return Math.min(3952, total);
    }

    let ALL_STUDENTS = [
      { id: "112175123", name: "葉清", grade: "112級", certs: [
        { name: "金融市場常識與職業道德", date: "2024/11/06" }, { name: "信託業務人員", date: "2026/01/17" },
        { name: "投信投顧業務員", date: "2026/03/03" }, { name: "TBSA商務企劃初階", date: "2025/05/29" },
        { name: "多益", date: "2026/09/20" }
      ]},
      { id: "111175103", name: "呂季生", grade: "111級", certs: [
        { name: "金融市場常識與職業道德", date: "2024/09/27" }, { name: "信託業務人員", date: "2024/08/27" },
        { name: "銀行內控與內稽", date: "2025/05/11" }, { name: "人身保險業務員", date: "2024/12/10" },
        { name: "財產保險業務員", date: "2025/02/26" }, { name: "投資型保險商品業務員", date: "2025/11/16" },
        { name: "外匯人員專業能力測驗", date: "2025/07/31" }, { name: "理財規劃人員專業能力測驗", date: "2026/04/12" },
        { name: "衍生性金融商品銷售人員資格測驗", date: "2026/01/06" }, { name: "人身保險業務員銷售外幣收付非投資型保險商品", date: "2025/03/23" },
        { name: "永續發展基礎能力測驗", date: "2025/04/13" }, { name: "投信投顧業務員", date: "2026/02/26" }
      ]}
    ];

    let selectedGrade = 'ALL';

    const GRADE_COLORS = {
      '111級': { badge: 'bg-[#8c6da6]', shirt: 0x9b7eb5, text: 'text-[#6f4b8f]', bg: 'bg-[#f0e9f5]' },
      '112級': { badge: 'bg-[#527e9b]', shirt: 0x6593b2, text: 'text-[#396482]', bg: 'bg-[#e7f0f5]' },
      '113級': { badge: 'bg-[#5b8753]', shirt: 0x6d9c65, text: 'text-[#446d3c]', bg: 'bg-[#eaf2e8]' },
      '114級': { badge: 'bg-[#c78b43]', shirt: 0xdaa059, text: 'text-[#9c6625]', bg: 'bg-[#f8ede0]' },
      '115級': { badge: 'bg-[#b86178]', shirt: 0xc9788e, text: 'text-[#8f3f54]', bg: 'bg-[#f7e8ec]' }
    };

    const DIRECTOR_QUOTES = [
      "今天礁溪天氣不錯，大家多考一張！",
      "爬上白木林，銀行面試不用愁！",
      "證照就像複利一樣，越早累積威力越大！",
      "穩住呼吸，一步一腳印登上玉山主峰！",
      "加油！我在最高峰頂為大家搖旗吶喊！",
      "信託、內控先拿好，大四實習任你挑！",
      "今天多看一章，明天考場笑著出來！",
      "山頂的風景最美，大家衝刺呀！"
    ];

    // ================= Three.js 3D 繪本浮島引擎 =================
    let scene, camera, renderer, controls;
    let islandRootGroup, studentPinsGroup;
    let clickableMeshes = [];
    let labelEntries = [];
    let directorObj = null, directorQuoteIdx = 0;
    let directorPosCurrent = new THREE.Vector3();
    let directorPosTarget = new THREE.Vector3();
    let cloudMeshes = [];
    let ambientLight, sunLight;

    const PEAK_HEIGHT = 13.5;
    const BASE_RADIUS = 11.2;

    function init3DScene() {
      const wrapper = document.getElementById('three-canvas-wrapper');
      const w = wrapper.clientWidth || 600;
      const h = wrapper.clientHeight || 500;

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 200);
      camera.position.set(0, 15.5, 29.5);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      wrapper.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.target.set(0, 5.2, 0.8);
      controls.minDistance = 11;
      controls.maxDistance = 52;
      // 限制最大仰角在水平面以上，徹底防止鏡頭翻轉到地下造成小人倒立
      controls.maxPolarAngle = Math.PI * 0.47;
      controls.minPolarAngle = 0.18;

      ambientLight = new THREE.AmbientLight(0xfff8eb, 0.85);
      scene.add(ambientLight);

      sunLight = new THREE.DirectionalLight(0xfff1d6, 0.92);
      sunLight.position.set(14, 28, 20);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 1024;
      sunLight.shadow.mapSize.height = 1024;
      sunLight.shadow.camera.near = 2;
      sunLight.shadow.camera.far = 70;
      const d = 18;
      sunLight.shadow.camera.left = -d;
      sunLight.shadow.camera.right = d;
      sunLight.shadow.camera.top = d;
      sunLight.shadow.camera.bottom = -d;
      scene.add(sunLight);

      const rimLight = new THREE.DirectionalLight(0xcbe8f5, 0.35);
      rimLight.position.set(-15, 10, -16);
      scene.add(rimLight);

      islandRootGroup = new THREE.Group();
      scene.add(islandRootGroup);

      buildIslandTerrain();
      buildDirector3D();

      studentPinsGroup = new THREE.Group();
      islandRootGroup.add(studentPinsGroup);

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let downPos = { x: 0, y: 0 };

      renderer.domElement.addEventListener('pointerdown', (e) => {
        downPos = { x: e.clientX, y: e.clientY };
      });

      renderer.domElement.addEventListener('pointerup', (e) => {
        const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
        if (dist > 6) return;

        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(clickableMeshes, true);
        if (hits.length > 0) {
          let target = hits[0].object;
          while (target && !target.userData.student && !target.userData.isDirector) {
            target = target.parent;
          }
          if (target && target.userData.student) {
            openStudentModal(target.userData.student);
          } else if (target && target.userData.isDirector) {
            cycleDirectorQuote();
          }
        }
      });

      window.addEventListener('resize', onWindowResize3D);
      animate3D();
    }

    function onWindowResize3D() {
      const wrapper = document.getElementById('three-canvas-wrapper');
      if (!wrapper || !renderer || !camera) return;
      const w = wrapper.clientWidth;
      const h = wrapper.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function resetCameraView() {
      camera.position.set(0, 15.5, 29.5);
      controls.target.set(0, 5.2, 0.8);
      controls.update();
    }

    function zoomCamera(factor) {
      const offset = camera.position.clone().sub(controls.target);
      const newLen = THREE.MathUtils.clamp(offset.length() * factor, 11, 52);
      offset.setLength(newLen);
      camera.position.copy(controls.target).add(offset);
      controls.update();
    }

    // 建構立體 3D 繪本浮島
    function buildIslandTerrain() {
      // 1. 浮島泥土岩盤底座
      const earthGeo = new THREE.CylinderGeometry(BASE_RADIUS * 0.98, 2.2, 5.2, 24);
      const earthMat = new THREE.MeshStandardMaterial({ color: 0x8d6241, roughness: 0.9, flatShading: true });
      const earthMesh = new THREE.Mesh(earthGeo, earthMat);
      earthMesh.position.y = -2.6;
      islandRootGroup.add(earthMesh);

      const midSoil = new THREE.Mesh(
        new THREE.CylinderGeometry(BASE_RADIUS * 1.01, BASE_RADIUS * 0.96, 0.9, 24),
        new THREE.MeshStandardMaterial({ color: 0xa47754, roughness: 0.85, flatShading: true })
      );
      midSoil.position.y = -0.35;
      islandRootGroup.add(midSoil);

      // 2. 浮島頂部綠意草坪台地
      const grassDisc = new THREE.Mesh(
        new THREE.CylinderGeometry(BASE_RADIUS * 1.03, BASE_RADIUS * 1.01, 0.55, 28),
        new THREE.MeshStandardMaterial({ color: 0x79a664, roughness: 0.8, flatShading: true })
      );
      grassDisc.position.y = 0.25;
      grassDisc.receiveShadow = true;
      islandRootGroup.add(grassDisc);

      // 懸浮小碎石
      const pebbleMat = new THREE.MeshStandardMaterial({ color: 0x7c5438, flatShading: true });
      [
        { x: -11.5, y: -2.2, z: 3.5, s: 0.55 },
        { x: 11.8, y: -1.8, z: -2.8, s: 0.65 },
        { x: 9.2, y: -3.6, z: 6.4, s: 0.42 },
        { x: -8.5, y: -3.2, z: -6.8, s: 0.48 }
      ].forEach(p => {
        const m = new THREE.Mesh(new THREE.DodecahedronGeometry(p.s, 0), pebbleMat);
        m.position.set(p.x, p.y, p.z);
        islandRootGroup.add(m);
      });

      // 3. 玉山主峰核心立體山體
      const mainPeak = new THREE.Mesh(
        new THREE.ConeGeometry(8.8, PEAK_HEIGHT, 24, 6),
        new THREE.MeshStandardMaterial({ color: 0x567f48, roughness: 0.82, flatShading: true })
      );
      mainPeak.position.y = PEAK_HEIGHT / 2 + 0.4;
      mainPeak.castShadow = true;
      mainPeak.receiveShadow = true;
      islandRootGroup.add(mainPeak);

      // 側峰雙子山丘（置於後方兩側，不遮擋正面攀爬步道）
      const subPeak1 = new THREE.Mesh(
        new THREE.ConeGeometry(4.4, 6.8, 14),
        new THREE.MeshStandardMaterial({ color: 0x638e53, roughness: 0.85, flatShading: true })
      );
      subPeak1.position.set(-5.8, 3.6, -2.6);
      subPeak1.castShadow = true;
      subPeak1.receiveShadow = true;
      islandRootGroup.add(subPeak1);

      const subPeak2 = new THREE.Mesh(
        new THREE.ConeGeometry(4.8, 7.6, 14),
        new THREE.MeshStandardMaterial({ color: 0x4c733f, roughness: 0.85, flatShading: true })
      );
      subPeak2.position.set(5.6, 4.0, -3.0);
      subPeak2.castShadow = true;
      subPeak2.receiveShadow = true;
      islandRootGroup.add(subPeak2);

      // 4. 童話糖霜積雪峰頂
      const snowH = PEAK_HEIGHT * 0.28;
      const snowCap = new THREE.Mesh(
        new THREE.ConeGeometry(8.8 * 0.295, snowH, 24),
        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.45, flatShading: true })
      );
      snowCap.position.y = PEAK_HEIGHT + 0.42 - snowH / 2;
      islandRootGroup.add(snowCap);

      // 5. 正面之字形蜿蜒攀登石階（所有同學在同一面依高低排列）
      const stepMat = new THREE.MeshStandardMaterial({ color: 0xf2e9da, roughness: 0.7 });
      const totalSteps = 46;
      for (let i = 0; i <= totalSteps; i++) {
        const t = i / totalSteps;
        const pos = getFrontSlopePosition(t, 0, 0);
        const stepMesh = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.14, 0.42), stepMat);
        stepMesh.position.copy(pos);
        stepMesh.position.y += 0.05;
        stepMesh.lookAt(0, pos.y + 0.05, 0);
        stepMesh.receiveShadow = true;
        islandRootGroup.add(stepMesh);
      }

      // 6. 營地里程碑旗幟（分置正面步道兩側，一目了然）
      const milestones = [
        { t: 0.99, side: 0, label: '🚩 玉山主峰頂 (3,952m)', bg: 'bg-[#e16161] text-white' },
        { t: 0.84, side: 1.5, label: '⛺ 排雲山莊 (3,402m)', bg: 'bg-[#d97736] text-white' },
        { t: 0.66, side: -1.6, label: '🌲 白木林觀景台 (2,700m)', bg: 'bg-[#3d6c8f] text-white' },
        { t: 0.44, side: 1.8, label: '🛖 孟祿亭 (1,800m)', bg: 'bg-[#48783d] text-white' }
      ];
      milestones.forEach(m => {
        const p = getFrontSlopePosition(m.t, m.side, 0.35);
        const anchor = new THREE.Object3D();
        anchor.position.copy(p);
        islandRootGroup.add(anchor);

        const pole = new THREE.Mesh(
          new THREE.CylinderGeometry(0.05, 0.05, 0.85, 8),
          new THREE.MeshStandardMaterial({ color: 0x6e472b })
        );
        pole.position.copy(p);
        pole.position.y += 0.35;
        islandRootGroup.add(pole);

        register3DLabel(anchor, m.label, `px-2 py-0.5 rounded-full text-[9px] font-black shadow-xs whitespace-nowrap ${m.bg}`, 20, false);
      });

      // 7. 島嶼邊緣繪本圓潤小樹叢
      [
        { x: -8.8, z: 4.5, s: 1.0 }, { x: -7.6, z: 6.4, s: 0.8 },
        { x: 8.6, z: 4.8, s: 1.1 }, { x: 7.4, z: 6.6, s: 0.85 },
        { x: -9.2, z: -2.0, s: 0.9 }, { x: 9.0, z: -1.8, s: 0.95 }
      ].forEach(tr => {
        const tree = new THREE.Group();
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.14 * tr.s, 0.18 * tr.s, 0.7 * tr.s, 8),
          new THREE.MeshStandardMaterial({ color: 0x785338 })
        );
        trunk.position.y = 0.35 * tr.s;
        const crown = new THREE.Mesh(
          new THREE.DodecahedronGeometry(0.68 * tr.s, 1),
          new THREE.MeshStandardMaterial({ color: 0x4f7a3e, flatShading: true })
        );
        crown.position.y = 0.95 * tr.s;
        crown.castShadow = true;
        tree.add(trunk, crown);
        tree.position.set(tr.x, 0.5, tr.z);
        islandRootGroup.add(tree);
      });

      // 8. 漂浮棉花糖 3D 雲朵
      const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, flatShading: true });
      [
        { x: -11.5, y: 12.5, z: -4, s: 1.1 },
        { x: 12.5, y: 14, z: -3, s: 1.25 },
        { x: -8.5, y: 15, z: 5, s: 0.85 }
      ].forEach(cp => {
        const cg = new THREE.Group();
        const c1 = new THREE.Mesh(new THREE.DodecahedronGeometry(1.1 * cp.s, 1), cloudMat);
        const c2 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.85 * cp.s, 1), cloudMat);
        c2.position.set(1.0 * cp.s, -0.15 * cp.s, 0.2 * cp.s);
        const c3 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.8 * cp.s, 1), cloudMat);
        c3.position.set(-0.95 * cp.s, -0.2 * cp.s, -0.1 * cp.s);
        cg.add(c1, c2, c3);
        cg.position.set(cp.x, cp.y, cp.z);
        cg.userData.baseX = cp.x;
        cg.userData.phase = Math.random() * Math.PI * 2;
        scene.add(cg);
        cloudMeshes.push(cg);
      });
    }

    /**
     * 計算正面山坡之字形（S型）登山座標
     * 所有學生都分布於面向鏡頭的正面山坡（+Z 側），同一畫面一眼看清高低進度
     * @param {number} t - 0 ~ 1（對應 0m ~ 3952m）
     * @param {number} lateralJitter - 左右微調避免重疊
     * @param {number} radialOffset - 貼近山坡表面的法向微調
     */
    function getFrontSlopePosition(t, lateralJitter = 0, radialOffset = 0.25) {
      const clampedT = THREE.MathUtils.clamp(t, 0, 0.985);
      const y = 0.55 + clampedT * (PEAK_HEIGHT - 0.35);

      // 隨高度往上，左右擺盪幅度自然收斂，貼合圓錐山體輪廓
      const coneRadiusAtY = 8.8 * (1 - clampedT * 0.95);
      const maxSwing = coneRadiusAtY * 0.72;
      // 之字形 S 曲線（從山腳一路向上盤旋 2.5 個轉折）
      const zigZagX = Math.sin(clampedT * Math.PI * 2.5) * maxSwing;
      const x = THREE.MathUtils.clamp(zigZagX + lateralJitter, -maxSwing * 1.15, maxSwing * 1.15);

      // 依據圓錐方程式 r^2 = x^2 + z^2，求取正面 (+Z) 山坡表面深度
      const surfaceR = (clampedT === 0 ? 9.4 : coneRadiusAtY + 0.32) + radialOffset;
      const zSq = Math.max(0.25, surfaceR * surfaceR - x * x);
      const z = Math.sqrt(zSq);

      return new THREE.Vector3(x, y, z);
    }

    // 建立 3D 木偶公仔人物（修正女生頭髮方向，開口朝臉部前方，絕不遮臉）
    function create3DCharacterMesh(isFemale, shirtHex) {
      const group = new THREE.Group();
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xfed7aa, roughness: 0.65 });
      const hairMat = new THREE.MeshStandardMaterial({ color: 0x1e1b18, roughness: 0.8 });
      const shirtMat = new THREE.MeshStandardMaterial({ color: shirtHex, roughness: 0.7 });
      const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
      const shoeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });

      // 雙腿與白鞋
      const legGeo = new THREE.CylinderGeometry(0.11, 0.1, 0.42, 10);
      const legL = new THREE.Mesh(legGeo, pantsMat);
      legL.position.set(-0.13, 0.25, 0);
      const legR = new THREE.Mesh(legGeo, pantsMat);
      legR.position.set(0.13, 0.25, 0);

      const shoeGeo = new THREE.BoxGeometry(0.22, 0.1, 0.3);
      const shoeL = new THREE.Mesh(shoeGeo, shoeMat);
      shoeL.position.set(-0.13, 0.05, 0.04);
      const shoeR = new THREE.Mesh(shoeGeo, shoeMat);
      shoeR.position.set(0.13, 0.05, 0.04);

      // 身體上衣
      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, 0.55, 14), shirtMat);
      torso.position.y = 0.72;
      torso.castShadow = true;

      // 雙手
      const armGeo = new THREE.CylinderGeometry(0.075, 0.075, 0.4, 8);
      const armL = new THREE.Mesh(armGeo, skinMat);
      armL.position.set(-0.33, 0.72, 0);
      armL.rotation.z = 0.18;
      const armR = new THREE.Mesh(armGeo, skinMat);
      armR.position.set(0.33, 0.72, 0);
      armR.rotation.z = -0.18;

      // 圓潤木偶頭部（正面朝向 +Z）
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 18, 16), skinMat);
      head.position.y = 1.32;
      head.castShadow = true;

      // 雙眼與粉嫩腮紅（位於 +Z 臉部正面）
      const eyeGeo = new THREE.SphereGeometry(0.036, 8, 8);
      const eyeL = new THREE.Mesh(eyeGeo, hairMat);
      eyeL.position.set(-0.11, 1.31, 0.31);
      const eyeR = new THREE.Mesh(eyeGeo, hairMat);
      eyeR.position.set(0.11, 1.31, 0.31);

      const blushMat = new THREE.MeshBasicMaterial({ color: 0xf87171 });
      const blushGeo = new THREE.SphereGeometry(0.042, 8, 8);
      const blushL = new THREE.Mesh(blushGeo, blushMat);
      blushL.scale.set(1.2, 0.7, 0.4);
      blushL.position.set(-0.18, 1.24, 0.29);
      const blushR = blushL.clone();
      blushR.position.set(0.18, 1.24, 0.29);

      // 頭頂黑髮（略向後腦傾斜，露出完整臉蛋與額頭瀏海）
      const hairCap = new THREE.Mesh(
        new THREE.SphereGeometry(0.365, 18, 14, 0, Math.PI * 2, 0, Math.PI * 0.54),
        hairMat
      );
      hairCap.position.set(0, 1.36, -0.03);
      hairCap.rotation.x = -0.25;
      group.add(hairCap);

      if (isFemale) {
        // 女生齊肩短髮（Three.js Cylinder theta=0 在 +Z 正前方，因此從 thetaStart = PI*0.32 開始繞過後方到 PI*1.68，正前方保持敞開露臉）
        const sideHairGeo = new THREE.CylinderGeometry(
          0.355,
          0.385,
          0.42,
          16,
          1,
          true,
          Math.PI * 0.32,
          Math.PI * 1.36
        );
        const sideHair = new THREE.Mesh(sideHairGeo, hairMat);
        sideHair.position.set(0, 1.18, -0.02);
        group.add(sideHair);
      }

      group.add(legL, legR, shoeL, shoeR, torso, armL, armR, head, eyeL, eyeR, blushL, blushR);
      return group;
    }

    // 建立 3D 系主任 NPC
    function buildDirector3D() {
      directorObj = new THREE.Group();
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xfed7aa, roughness: 0.65 });
      const hairMat = new THREE.MeshStandardMaterial({ color: 0x1c1917, roughness: 0.7 });
      const suitMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.7 });
      const shirtMat = new THREE.MeshStandardMaterial({ color: 0x1e3a8a, roughness: 0.6 });
      const pantsMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });

      const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.12, 0.52, 10), pantsMat);
      legL.position.set(-0.15, 0.26, 0);
      const legR = legL.clone();
      legR.position.set(0.15, 0.26, 0);

      const suit = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.34, 0.68, 14), suitMat);
      suit.position.y = 0.84;
      suit.castShadow = true;

      const tieShirt = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.52, 0.08), shirtMat);
      tieShirt.position.set(0, 0.92, 0.29);

      const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.5, 8), suitMat);
      armL.position.set(-0.4, 0.84, 0);
      armL.rotation.z = 0.15;
      const armR = armL.clone();
      armR.position.set(0.4, 0.84, 0);
      armR.rotation.z = -0.15;

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 18, 16), skinMat);
      head.position.y = 1.56;
      head.castShadow = true;

      const hair = new THREE.Mesh(
        new THREE.SphereGeometry(0.42, 18, 14, 0, Math.PI * 2, 0, Math.PI * 0.52),
        hairMat
      );
      hair.position.set(0, 1.6, -0.03);
      hair.rotation.x = -0.22;

      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.042, 8, 8), hairMat);
      eyeL.position.set(-0.13, 1.57, 0.37);
      const eyeR = eyeL.clone();
      eyeR.position.set(0.13, 1.57, 0.37);

      directorObj.add(legL, legR, suit, tieShirt, armL, armR, head, hair, eyeL, eyeR);
      directorObj.scale.setScalar(1.22);
      directorObj.userData.isDirector = true;

      const startPos = getFrontSlopePosition(0.55, 0.9, 0.35);
      directorPosCurrent.copy(startPos);
      directorPosTarget.copy(startPos);
      directorObj.position.copy(startPos);

      islandRootGroup.add(directorObj);
      clickableMeshes.push(directorObj);
    }

    function register3DLabel(obj3D, htmlContent, className, offsetY = 26, isInteractive = false, onClick = null) {
      const overlay = document.getElementById('labels-3d-overlay');
      const el = document.createElement('div');
      el.className = `absolute transform -translate-x-1/2 -translate-y-full select-none ${className}`;
      el.innerHTML = htmlContent;
      if (isInteractive && onClick) {
        el.style.pointerEvents = 'auto';
        el.style.cursor = 'pointer';
        el.onclick = onClick;
      }
      overlay.appendChild(el);
      labelEntries.push({ obj3D, el, offsetY });
      return el;
    }

    let directorBubbleEl = null;

    function cycleDirectorQuote() {
      directorQuoteIdx = (directorQuoteIdx + 1) % DIRECTOR_QUOTES.length;
      if (directorBubbleEl) {
        const span = directorBubbleEl.querySelector('#director-quote-3d');
        if (span) span.innerText = DIRECTOR_QUOTES[directorQuoteIdx];
      }
    }

    function startDirectorPatrol() {
      const patrolTs = [0.18, 0.38, 0.55, 0.74, 0.90];
      setInterval(() => {
        const t = patrolTs[Math.floor(Math.random() * patrolTs.length)];
        const sideJitter = (Math.random() - 0.5) * 1.4;
        directorPosTarget.copy(getFrontSlopePosition(t, sideJitter, 0.35));
        cycleDirectorQuote();
      }, 14000);
    }

    // 依篩選結果在正面山坡重建 3D 學生公仔與名牌
    function rebuild3DStudents(list) {
      if (!studentPinsGroup) return;

      while (studentPinsGroup.children.length > 0) {
        studentPinsGroup.remove(studentPinsGroup.children[0]);
      }
      clickableMeshes = directorObj ? [directorObj] : [];

      const overlay = document.getElementById('labels-3d-overlay');
      labelEntries = labelEntries.filter(entry => {
        if (entry.el.dataset.isStudentLabel === 'true') {
          overlay.removeChild(entry.el);
          return false;
        }
        return true;
      });

      if (!directorBubbleEl && directorObj) {
        directorBubbleEl = register3DLabel(
          directorObj,
          `<div class="flex flex-col items-center">
            <div class="bg-[#fcd472] text-[#3c2a13] text-[9px] sm:text-[11px] font-black px-2.5 py-1 rounded-2xl shadow-md border border-white whitespace-nowrap mb-0.5">
              <span id="director-quote-3d">${DIRECTOR_QUOTES[0]}</span>
            </div>
            <span class="bg-[#3d4a39] text-[#fcd472] border border-[#fcd472]/40 text-[8px] sm:text-[9px] px-2 py-0.2 rounded-full font-bold shadow-xs">系主任</span>
          </div>`,
          'speech-bubble-3d z-30',
          46,
          true,
          cycleDirectorQuote
        );
      }

      // 統計同高度層級人數，讓同海拔多位同學左右排開不重疊
      const tierBuckets = {};

      list.forEach((st, idx) => {
        const certCount = st.certs ? st.certs.length : 0;
        const altitude = calculateStudentAltitude(st.certs);
        const ratio = altitude / 3952;

        const tierKey = Math.round(altitude / 200);
        const slotIdx = tierBuckets[tierKey] || 0;
        tierBuckets[tierKey] = slotIdx + 1;

        // 0m 登山口草坪寬廣，左右排開幅度較大；越高處隨山體收斂
        const spreadUnit = altitude === 0 ? 0.55 : 0.45;
        const signedOffset = (slotIdx % 2 === 0 ? 1 : -1) * Math.ceil(slotIdx / 2) * spreadUnit;
        const heightJitter = altitude === 0 ? ((slotIdx % 3) * 0.012) : 0;

        const pos = getFrontSlopePosition(Math.min(0.97, ratio + heightJitter), signedOffset, 0.28);
        const conf = GRADE_COLORS[st.grade] || { badge: 'bg-[#527e9b]', shirt: 0x6593b2 };
        const isFemale = (st.name.charCodeAt(st.name.length - 1) % 2 === 0);

        const charMesh = create3DCharacterMesh(isFemale, conf.shirt);
        charMesh.position.copy(pos);
        // 公仔正面朝向鏡頭前方 (+Z)
        charMesh.lookAt(pos.x, pos.y, pos.z + 10);
        charMesh.userData.student = st;
        charMesh.userData.phase = idx * 0.7;

        studentPinsGroup.add(charMesh);
        clickableMeshes.push(charMesh);

        const labelEl = register3DLabel(
          charMesh,
          `<div class="px-1.5 py-0.2 rounded-full text-[8px] sm:text-[9px] font-black text-white shadow-xs whitespace-nowrap ${conf.badge} hover:scale-110 transition">
            ${st.name} ${certCount > 0 ? `(${certCount})` : ''}
          </div>`,
          'z-20',
          34,
          true,
          () => openStudentModal(st)
        );
        labelEl.dataset.isStudentLabel = 'true';
      });
    }

    const clock = new THREE.Clock();
    function animate3D() {
      requestAnimationFrame(animate3D);
      const t = clock.getElapsedTime();

      if (islandRootGroup) {
        islandRootGroup.position.y = Math.sin(t * 1.1) * 0.2;
      }

      cloudMeshes.forEach((c, idx) => {
        c.position.x = c.userData.baseX + Math.sin(t * 0.25 + c.userData.phase) * 1.8;
        c.position.y += Math.sin(t * 0.6 + idx) * 0.002;
      });

      if (studentPinsGroup) {
        studentPinsGroup.children.forEach(char => {
          const p = char.userData.phase || 0;
          char.rotation.z = Math.sin(t * 3.2 + p) * 0.05;
        });
      }

      if (directorObj) {
        directorPosCurrent.lerp(directorPosTarget, 0.015);
        directorObj.position.copy(directorPosCurrent);
        directorObj.rotation.z = Math.sin(t * 2.5) * 0.05;
      }

      controls.update();
      renderer.render(scene, camera);
      update3DProjectedLabels();
    }

    function update3DProjectedLabels() {
      const wrapper = document.getElementById('three-canvas-wrapper');
      if (!wrapper) return;
      const w = wrapper.clientWidth;
      const h = wrapper.clientHeight;
      const tempV = new THREE.Vector3();

      labelEntries.forEach(entry => {
        entry.obj3D.updateWorldMatrix(true, false);
        tempV.setFromMatrixPosition(entry.obj3D.matrixWorld);
        tempV.project(camera);

        if (tempV.z > 1) {
          entry.el.style.display = 'none';
          return;
        }
        entry.el.style.display = 'block';
        const x = (tempV.x * 0.5 + 0.5) * w;
        const y = (-(tempV.y * 0.5) + 0.5) * h - entry.offsetY;
        entry.el.style.left = `${x}px`;
        entry.el.style.top = `${y}px`;
      });
    }

    // ================= 試算表資料與天氣連動 =================
    async function fetchLiveDataFromGoogleSheet(isManual = false) {
      const syncBadge = document.getElementById('sync-status');
      try {
        if (isManual && syncBadge) {
          syncBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-[#c78b43] animate-spin"></span><span>同步中</span>`;
        }

        const res = await fetch(GOOGLE_SHEET_API_URL);
        const liveData = await res.json();
        
        if (Array.isArray(liveData) && liveData.length > 0) {
          ALL_STUDENTS = liveData;
          renderGradeSummaryCards();
          renderTeamView();

          if (syncBadge) {
            syncBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-[#528741] animate-pulse"></span><span>已連動(${liveData.length}人)</span>`;
          }
          if (isManual) alert(`同步成功！已成功連動全系 ${liveData.length} 位同學最新紀錄！`);
        }
      } catch (err) {
        console.warn("連動試算表失敗，已採用快取資料顯示", err);
      }
    }

    async function fetchJiaoxiWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=24.82&longitude=121.77&current_weather=true&daily=sunrise,sunset&timezone=Asia%2FTaipei');
        const data = await res.json();
        if (data && data.current_weather) {
          const temp = Math.round(data.current_weather.temperature);
          const weatherCode = data.current_weather.weathercode;
          const isDay = data.current_weather.is_day;
          updateWeatherUI(temp, weatherCode, isDay);
          updateSkyBackground(isDay, weatherCode);
        }
      } catch (err) {
        applyDefaultDaySky();
      }
    }

    function updateWeatherUI(temp, code, isDay) {
      document.getElementById('weather-temp').innerText = `${temp}°C`;
      const descEl = document.getElementById('weather-desc');
      const iconEl = document.getElementById('weather-icon');
      let desc = '晴朗';
      let icon = isDay ? '☀️' : '🌙';

      if (code >= 51 && code <= 67) {
        desc = '飄雨';
        icon = '🌧️';
        showRainEffect(true);
      } else if (code >= 1 && code <= 3) {
        desc = '多雲';
        icon = isDay ? '⛅' : '☁️';
        showRainEffect(false);
      } else if (code >= 80) {
        desc = '陣雨';
        icon = '🌦️';
        showRainEffect(true);
      } else {
        showRainEffect(false);
      }
      descEl.innerText = desc;
      iconEl.innerText = icon;
    }

    function showRainEffect(enable) {
      const rainLayer = document.getElementById('rain-layer');
      rainLayer.innerHTML = '';
      if (enable) {
        rainLayer.classList.remove('hidden');
        for (let i = 0; i < 30; i++) {
          const drop = document.createElement('div');
          drop.className = 'rain-drop';
          drop.style.left = `${Math.random() * 100}%`;
          drop.style.animationDuration = `${0.6 + Math.random() * 0.5}s`;
          drop.style.animationDelay = `${Math.random() * 2}s`;
          rainLayer.appendChild(drop);
        }
      } else {
        rainLayer.classList.add('hidden');
      }
    }

    function updateSkyBackground(isDay, code) {
      const container = document.getElementById('sky-canvas-container');
      const celestial = document.getElementById('celestial-graphic');
      const hour = new Date().getHours();

      if (!isDay || hour < 5 || hour >= 18) {
        container.style.background = 'linear-gradient(to bottom, #1f2839 0%, #2b394f 45%, #415570 100%)';
        celestial.innerText = '🌙';
        celestial.className = 'w-9 h-9 sm:w-12 sm:h-12 rounded-full bg-[#fcedbb] shadow-[0_0_20px_rgba(252,237,187,0.7)] flex items-center justify-center text-base sm:text-xl';
        if (ambientLight) ambientLight.color.setHex(0x8ba2c7);
        if (sunLight) { sunLight.color.setHex(0xcbe0ff); sunLight.intensity = 0.65; }
      } else if (hour >= 16 && hour < 18) {
        container.style.background = 'linear-gradient(to bottom, #e8b18a 0%, #edd3ba 40%, #e2e1dc 100%)';
        celestial.innerText = '🌇';
        if (ambientLight) ambientLight.color.setHex(0xffdfba);
        if (sunLight) { sunLight.color.setHex(0xffb870); sunLight.intensity = 0.95; }
      } else if (code >= 51) {
        container.style.background = 'linear-gradient(to bottom, #abb7b8 0%, #c8d3d4 50%, #e5e5de 100%)';
        celestial.innerText = '🌧️';
        if (ambientLight) ambientLight.color.setHex(0xd8e0e5);
        if (sunLight) sunLight.intensity = 0.6;
      } else {
        applyDefaultDaySky();
      }
    }

    function applyDefaultDaySky() {
      const container = document.getElementById('sky-canvas-container');
      container.style.background = 'linear-gradient(to bottom, #8ec7d2 0%, #bae2e8 45%, #edf3e4 100%)';
      if (ambientLight) ambientLight.color.setHex(0xfff8eb);
      if (sunLight) { sunLight.color.setHex(0xfff1d6); sunLight.intensity = 0.95; }
    }

    function renderGradeSummaryCards() {
      const container = document.getElementById('grade-summary-cards');
      container.innerHTML = '';
      const grades = ['ALL', '111級', '112級', '113級', '114級', '115級'];

      grades.forEach(g => {
        const list = g === 'ALL' ? ALL_STUDENTS : ALL_STUDENTS.filter(s => s.grade === g);
        const total = list.length;
        const certified = list.filter(s => s.certs && s.certs.length > 0).length;
        const totalCerts = list.reduce((sum, s) => sum + (s.certs ? s.certs.length : 0), 0);
        const isCurrent = selectedGrade === g;

        const card = document.createElement('div');
        card.className = `p-2.5 sm:p-3.5 rounded-2xl border transition-all cursor-pointer flex flex-col justify-between shrink-0 w-28 sm:w-auto ${
          isCurrent 
            ? 'bg-[#608058] text-white shadow-md border-[#608058] ring-2 ring-[#a3c399]' 
            : 'bg-[#fbf7f0] text-[#4b4033] border-[#e8dccb] hover:border-[#b8a994] hover:bg-[#f4ece1]'
        }`;
        card.onclick = () => selectGradeFilter(g);

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-0.5 sm:mb-1">
              <span class="font-black text-xs sm:text-sm truncate">${g === 'ALL' ? '🌟全系' : g}</span>
              <span class="text-[9px] font-bold px-1.5 py-0.2 rounded ${isCurrent ? 'bg-white/20 text-white' : 'bg-[#eeddc8] text-[#5e4b37]'}">
                ${total}
              </span>
            </div>
            <p class="text-[9px] sm:text-[11px] ${isCurrent ? 'text-[#dbe8d5]' : 'text-[#8c8275]'}">已考: <b>${certified}人</b></p>
          </div>
          <div class="mt-1.5 pt-1.5 border-t ${isCurrent ? 'border-white/20' : 'border-[#ebdcc7]'} flex items-baseline justify-between text-[10px] sm:text-[11px]">
            <span class="${isCurrent ? 'text-[#dbe8d5]' : 'text-[#8c8275]'}">總張數</span>
            <span class="font-black text-xs sm:text-sm">${totalCerts}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function selectGradeFilter(g) {
      selectedGrade = g;
      renderGradeSummaryCards();
      renderTeamView();
    }

    function getFilteredStudents() {
      const search = document.getElementById('team-search-input').value.trim().toLowerCase();
      return ALL_STUDENTS.filter(s => {
        const matchGrade = (selectedGrade === 'ALL' || s.grade === selectedGrade);
        const matchSearch = s.name.toLowerCase().includes(search) || (s.id && s.id.toLowerCase().includes(search));
        return matchGrade && matchSearch;
      });
    }

    function renderTeamView() {
      const list = getFilteredStudents();
      const totalStudents = list.length;
      const certifiedStudents = list.filter(s => s.certs && s.certs.length > 0).length;
      const totalCerts = list.reduce((sum, s) => sum + (s.certs ? s.certs.length : 0), 0);

      document.getElementById('current-filter-title').innerText = selectedGrade === 'ALL' ? '全體學生' : selectedGrade;
      document.getElementById('stat-total-students').innerText = totalStudents;
      document.getElementById('stat-certified-students').innerText = certifiedStudents;
      document.getElementById('stat-total-certs').innerText = totalCerts;

      rebuild3DStudents(list);
      renderTeamRoster(list);
    }

    function renderTeamRoster(list) {
      const container = document.getElementById('team-roster-list');
      container.innerHTML = '';

      const sorted = [...list].sort((a, b) => {
        const countA = a.certs ? a.certs.length : 0;
        const countB = b.certs ? b.certs.length : 0;
        if (countB !== countA) return countB - countA;
        return calculateStudentAltitude(b.certs) - calculateStudentAltitude(a.certs);
      });

      if (sorted.length === 0) {
        container.innerHTML = `<div class="p-6 text-center text-xs text-[#8c8275]">查無學生資料</div>`;
        return;
      }

      sorted.forEach((st, idx) => {
        const certCount = st.certs ? st.certs.length : 0;
        const alt = calculateStudentAltitude(st.certs);
        const pct = Math.min(100, Math.round((alt / 3952) * 100));
        const conf = GRADE_COLORS[st.grade] || { bg: 'bg-[#f4ece1]', text: 'text-[#5e4b37]' };

        const card = document.createElement('div');
        card.className = 'p-2.5 sm:p-3 bg-[#f4ece1]/80 border border-[#e8dccb] rounded-2xl hover:bg-[#ede1d2] hover:border-[#cfbca6] transition cursor-pointer flex flex-col gap-1.5 sm:gap-2';
        card.onclick = () => openStudentModal(st);

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2 min-w-0">
              <span class="w-4 text-center text-xs font-black ${idx < 3 ? 'text-[#b46b2b]' : 'text-[#9e9080]'}">${idx + 1}</span>
              <div class="truncate">
                <p class="text-xs font-bold text-[#3d4a39] truncate">
                  ${st.name} 
                  <span class="text-[9px] font-bold px-1.5 py-0.2 rounded-full ${conf.bg} ${conf.text} ml-0.5">${st.grade}</span>
                </p>
                <p class="text-[9px] text-[#8c8275]">學號: ${st.id || '未登記'}</p>
              </div>
            </div>
            <div class="text-right shrink-0">
              <span class="px-1.5 py-0.5 rounded-full text-[9px] sm:text-[10px] font-bold ${
                certCount >= 5 ? 'bg-[#e3ecd7] text-[#4d6a42]' : certCount > 0 ? 'bg-[#e7f0f5] text-[#396482]' : 'bg-[#e8dccb] text-[#706456]'
              }">
                ${certCount} 張
              </span>
              <p class="text-[9px] sm:text-[10px] text-[#b46b2b] font-bold mt-0.5">${alt.toLocaleString()} m</p>
            </div>
          </div>
          <div class="w-full bg-[#ded0bf] h-1 sm:h-1.5 rounded-full overflow-hidden">
            <div class="bg-gradient-to-r from-[#c78b43] to-[#5b8753] h-full rounded-full" style="width: ${pct}%"></div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openStudentModal(student) {
      const modal = document.getElementById('student-modal');
      const certCount = student.certs ? student.certs.length : 0;
      const altitude = calculateStudentAltitude(student.certs);

      document.getElementById('modal-student-name').innerText = student.name;
      document.getElementById('modal-student-grade').innerText = student.grade || '未設定';
      document.getElementById('modal-student-id').innerText = `學號：${student.id || '未設定'}`;
      document.getElementById('modal-student-altitude').innerText = `${altitude.toLocaleString()} m`;
      document.getElementById('modal-student-count').innerText = `${certCount} 張`;

      const certsContainer = document.getElementById('modal-student-certs');
      certsContainer.innerHTML = '';

      if (certCount === 0) {
        certsContainer.innerHTML = `<div class="p-5 text-center text-[#8c8275] bg-[#f4ece1] rounded-xl text-xs">尚無考取紀錄，在島嶼登山口整裝待發！</div>`;
      } else {
        student.certs.forEach(c => {
          const meters = getCertPoints(c.name);
          const item = document.createElement('div');
          item.className = 'p-2 bg-[#fbf7f0] rounded-xl border border-[#ebdcc7] flex items-center justify-between shadow-2xs';
          item.innerHTML = `
            <div class="min-w-0 pr-2">
              <p class="font-bold text-[#3d4a39] truncate text-xs">${c.name}</p>
              <p class="text-[9px] text-[#8c8275]">考取日期：${c.date || '無紀錄'}</p>
            </div>
            <span class="px-1.5 py-0.5 bg-[#eeddc8] text-[#7d5c34] font-black rounded-lg text-[9px] whitespace-nowrap">+${meters}m</span>
          `;
          certsContainer.appendChild(item);
        });
      }

      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeStudentModal() {
      document.getElementById('student-modal').classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      init3DScene();
      renderGradeSummaryCards();
      renderTeamView();
      fetchJiaoxiWeather();
      startDirectorPatrol();
      lucide.createIcons();
      fetchLiveDataFromGoogleSheet();
    });
  </script>
</body>
</html>
