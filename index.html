<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>經濟系考照百岳修煉圖・宜蘭礁溪即時連動版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif; }
    
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* 雨滴動畫 */
    .rain-drop {
      position: absolute;
      background: linear-gradient(transparent, rgba(255, 255, 255, 0.7));
      width: 1.5px;
      height: 14px;
      animation: fall linear infinite;
      pointer-events: none;
    }
    @keyframes fall {
      0% { transform: translateY(-20px) translateX(0); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(540px) translateX(-20px); opacity: 0.2; }
    }

    /* 主任打氣氣泡緩慢浮動 */
    @keyframes bubbleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .speech-bubble {
      animation: bubbleFloat 4s ease-in-out infinite;
    }

    /* 人物小人踏步微擺動 */
    @keyframes walkBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    .char-figure {
      animation: walkBounce 2.5s ease-in-out infinite;
    }

    /* 手繪山岳筆觸 */
    .crayon-style {
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body class="bg-[#fcfaf7] text-slate-800 min-h-screen flex flex-col">

  <!-- 頂部導航列 -->
  <header class="bg-white/90 backdrop-blur-md border-b border-amber-100 sticky top-0 z-40 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-amber-500 text-white flex items-center justify-center font-black text-xl shadow-inner">
          ⛰️
        </div>
        <div>
          <h1 class="font-black text-lg md:text-xl text-slate-800 tracking-tight leading-tight flex items-center gap-1.5">
            經濟百岳修煉圖
            <span class="text-xs font-bold px-2 py-0.5 bg-amber-100 text-amber-800 rounded-full">宜蘭礁溪天氣實況</span>
          </h1>
          <p class="text-xs text-slate-400 hidden sm:block">佛光大學應用經濟學系・證照登山大隊</p>
        </div>
      </div>

      <!-- 右側資訊：雲端同步狀態與礁溪天氣 -->

        <div id="sync-status" class="hidden sm:flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-[11px] font-bold">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>雲端已自動連動</span>
        </div>

        <div class="flex items-center space-x-2 bg-amber-50/80 border border-amber-200/60 px-3 py-1.5 rounded-2xl">
          <span id="weather-icon" class="text-xl">🌤️</span>
          <div class="text-left text-xs leading-tight">
            <p class="font-black text-slate-700" id="weather-temp">宜蘭礁溪 --°C</p>
            <p class="text-[10px] text-amber-700 font-medium" id="weather-desc">連線天氣中...</p>
          </div>
        </div>
      </div>
    </div>
  </header>

          <!-- 系主任慢速巡山 NPC -->

            <!-- 主任打氣氣泡 -->
            <div class="speech-bubble relative -top-2 bg-amber-400 text-slate-900 text-[11px] font-black px-3 py-1.5 rounded-2xl shadow-lg border-2 border-white whitespace-nowrap">
              <span id="director-quote">今天礁溪天氣不錯，大家多考一張！</span>
              <div class="absolute -bottom-1.5 left-1/2 transform -translate-x-1/2 w-3 h-3 bg-amber-400 rotate-45 border-r-2 border-b-2 border-white"></div>

            <div class="flex flex-col items-center select-none">

                <circle cx="28" cy="22" r="13" fill="#fed7aa"/>

                <path d="M 31,15 Q 34,13 39,14" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round"/>

                <ellipse cx="16" cy="23" rx="2.5" ry="1.3" fill="#f87171" opacity="0.6"/>
                <ellipse cx="40" cy="23" rx="2.5" ry="1.3" fill="#f87171" opacity="0.6"/>
                <path d="M 23,26 Q 28,30 33,26" fill="none" stroke="#78350f" stroke-width="1.8" stroke-linecap="round"/>
                <polygon points="25,35 31,35 28,42" fill="#1e3a8a"/>
                <path d="M 18,35 C 16,36 15,48 15,53 L 41,53 C 41,48 40,36 38,35 L 32,45 L 24,45 Z" fill="#475569"/>
                <path d="M 18,35 L 25,46 L 22,46 Z" fill="#334155"/>
                <path d="M 38,35 L 31,46 L 34,46 Z" fill="#334155"/>
                <rect x="11" y="36" width="5.5" height="15" rx="2.5" fill="#475569"/>
                <rect x="39.5" y="36" width="5.5" height="15" rx="2.5" fill="#475569"/>
                <rect x="19" y="53" width="7" height="14" rx="1.5" fill="#1e293b"/>
                <rect x="30" y="53" width="7" height="14" rx="1.5" fill="#1e293b"/>
                <rect x="18" y="67" width="8" height="4" rx="1.5" fill="#0f172a"/>
                <rect x="30" y="67" width="8" height="4" rx="1.5" fill="#0f172a"/>
              </svg>
              <span class="mt-0.5 bg-slate-800 text-amber-300 border border-amber-300/40 text-[9px] px-2 py-0.2 rounded-full font-bold shadow-xs">系主任</span>
            </div>
          </div>

        </div>
      </div>

      <!-- 右側：學生考照成就排行榜 -->
      <div class="lg:col-span-4 bg-white rounded-3xl p-5 border border-amber-100 shadow-sm flex flex-col gap-3">
        <div class="flex items-center justify-between border-b border-amber-50 pb-2">
          <h2 class="font-black text-sm text-slate-800 flex items-center space-x-1.5">
            <span class="text-base">🏆</span>
            <span>學生考照成就排行榜</span>
          </h2>
          <span class="text-[10px] text-slate-400">點擊查看個人履歷</span>
        </div>

        <div id="team-roster-list" class="custom-scroll max-h-[480px] overflow-y-auto space-y-2 pr-1"></div>
      </div>
    </div>
  </main>

  <!-- 學生登山履歷手冊 Modal -->
  <div id="student-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl border border-amber-100 overflow-hidden">
      <div class="p-5 border-b border-amber-100 flex items-center justify-between bg-amber-50/50">
        <div class="flex items-center space-x-3">
          <div class="w-12 h-12 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-2xl font-black shadow-inner">
            🧗
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <h3 id="modal-student-name" class="font-black text-lg text-slate-800">學生姓名</h3>
              <span id="modal-student-grade" class="px-2 py-0.5 bg-blue-100 text-blue-800 text-xs font-bold rounded-full">112級</span>
            </div>
            <p id="modal-student-id" class="text-xs text-slate-400 mt-0.5">學號：未設定</p>
          </div>
        </div>
        <button onclick="closeStudentModal()" class="w-8 h-8 rounded-full hover:bg-slate-200 flex items-center justify-center text-slate-400 hover:text-slate-700 transition">✕</button>
      </div>

      <div class="p-5 space-y-4">
        <div class="grid grid-cols-2 gap-3 bg-amber-50/30 p-3 rounded-2xl border border-amber-100/60 text-center">
          <div>
            <span class="text-[11px] font-bold text-slate-400">當前攀登海拔</span>
            <p id="modal-student-altitude" class="text-2xl font-black text-blue-600 mt-0.5">0 m</p>
          </div>
          <div>
            <span class="text-[11px] font-bold text-slate-400">累計考取證照</span>
            <p id="modal-student-count" class="text-2xl font-black text-emerald-600 mt-0.5">0 張</p>
          </div>
        </div>

        <div>
          <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center space-x-1">
            <i data-lucide="award" class="w-3.5 h-3.5 text-amber-500"></i>
            <span>已考取之證照紀錄</span>
          </h4>
          <div id="modal-student-certs" class="custom-scroll max-h-56 overflow-y-auto space-y-1.5 pr-1 text-xs"></div>
        </div>
      </div>

      <div class="p-4 bg-slate-50 border-t border-slate-100 text-right">
        <button onclick="closeStudentModal()" class="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold hover:bg-slate-700 transition">關閉手冊</button>
      </div>
    </div>
  </div>

  <script>
    // 你的專屬 Google Apps Script API 網址
    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyUJjAYpBxqx7CJHAEil7-BJtnU_4D9R0MS0Cli6SeNDxLeBp60PZ-L_nCii1breC22bQ/exec";

    // 證照庫定義
    const CERT_DATABASE = [
      { id: 'c1', name: '金融市場常識與職業道德', meters: 200 },
      { id: 'c2', name: 'TBSA商務企劃初階', meters: 200 },
      { id: 'c3', name: '生成式AI', meters: 200 },
      { id: 'c4', name: '生成式AI辦公室應用能力認證', meters: 250 },
      { id: 'c5', name: '永續發展基礎能力測驗', meters: 250 },
      { id: 'c6', name: '企業化永續管理師合格證書-碳盤查', meters: 350 },
      { id: 'c7', name: '企業化永續管理師合格證書-永續報告書', meters: 350 },
      { id: 'b1', name: '信託業務人員', meters: 200 },
      { id: 'b2', name: '銀行內控與內稽', meters: 200 },
      { id: 'b3', name: '票券商業務人員', meters: 250 },
      { id: 'b4', name: '初階授信人員專業能力測驗', meters: 300 },
      { id: 'b5', name: '初階外匯人員專業能力測驗', meters: 300 },
      { id: 'b6', name: '外匯交易專業能力測驗', meters: 350 },
      { id: 'b7', name: '理財規劃人員專業能力測驗', meters: 300 },
      { id: 'b8', name: '金融人員風險管理專業能力測驗', meters: 400 },
      { id: 'b9', name: '金融人員授信擔保品估價專業能力測驗', meters: 350 },
      { id: 'b10', name: '債權委外催收測驗', meters: 200 },
      { id: 's1', name: '證券商業務人員', meters: 200 },
      { id: 's2', name: '證券商高級業務人員', meters: 350 },
      { id: 's3', name: '期貨商業務員', meters: 250 },
      { id: 's4', name: '投信投顧業務員', meters: 250 },
      { id: 's5', name: '投信投顧法規乙科', meters: 200 },
      { id: 's6', name: '衍生性金融商品銷售人員資格測驗', meters: 350 },
      { id: 's7', name: '企業內部控制', meters: 200 },
      { id: 's8', name: '債券人員', meters: 300 },
      { id: 's9', name: '資產證券化', meters: 300 },
      { id: 's10', name: '證券投資分析人員', meters: 800 },
      { id: 's11', name: '期貨交易分析人員', meters: 800 },
      { id: 'i1', name: '人身保險業務員', meters: 200 },
      { id: 'i2', name: '財產保險業務員', meters: 200 },
      { id: 'i3', name: '投資型保險商品業務員', meters: 250 },
      { id: 'i4', name: '人身保險業務員銷售外幣收付非投資型保險商品', meters: 250 },
      { id: 'i5', name: '人壽保險核保理賠人員', meters: 400 },
      { id: 'i6', name: '財產保險核保理賠人員', meters: 400 },
      { id: 'l1', name: '多益', meters: 300 },
      { id: 'l2', name: '托福', meters: 500 },
      { id: 'l3', name: '雅思', meters: 500 }
    ];

    function getCertPoints(rawName) {
      if (!rawName) return 200;
      const s = String(rawName).trim();
      const direct = CERT_DATABASE.find(c => c.name === s);
      if (direct) return direct.meters;
      if (s.includes('分析人員') || s.includes('分析師')) return 800;
      if (s.includes('托福') || s.includes('雅思')) return 500;
      if (s.includes('核保') || s.includes('風險管理')) return 400;
      if (s.includes('外匯') || s.includes('授信') || s.includes('衍生性') || s.includes('高業') || s.includes('高級') || s.includes('多益') || s.includes('碳盤查') || s.includes('永續報告書')) return 350;
      if (s.includes('期貨') || s.includes('投信') || s.includes('投資型') || s.includes('外幣') || s.includes('理財規劃') || s.includes('永續發展') || s.includes('AI辦公室') || s.includes('票券')) return 250;
      return 200;
    }

    function calculateStudentAltitude(certs) {
      if (!certs || !Array.isArray(certs) || certs.length === 0) return 0;
      let total = 0;
      certs.forEach(c => { total += getCertPoints(c.name); });
      return Math.min(3952, total);

    // ================= 2. 宜蘭礁溪即時天氣串接 =================
    async function fetchJiaoxiWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=24.82&longitude=121.77&current_weather=true&daily=sunrise,sunset&timezone=Asia%2FTaipei');
        const data = await res.json();
        if (data && data.current_weather) {
          const temp = Math.round(data.current_weather.temperature);
          const weatherCode = data.current_weather.weathercode;
          const isDay = data.current_weather.is_day;
          updateWeatherUI(temp, weatherCode, isDay);
          updateSkyBackground(isDay, weatherCode);
        }
      } catch (err) {
        applyDefaultDaySky();
      }
    }

    function updateWeatherUI(temp, code, isDay) {
      document.getElementById('weather-temp').innerText = `宜蘭礁溪 ${temp}°C`;
      const descEl = document.getElementById('weather-desc');
      const iconEl = document.getElementById('weather-icon');
      let desc = '天氣晴朗';
      let icon = isDay ? '☀️' : '🌙';

      if (code >= 51 && code <= 67) {
        desc = '飄雨連綿・登山口微雨';
        icon = '🌧️';
        showRainEffect(true);
      } else if (code >= 1 && code <= 3) {
        desc = '多雲舒適・適合攀登';
        icon = isDay ? '⛅' : '☁️';
        showRainEffect(false);
      } else if (code >= 80) {
        desc = '陣雨綿綿';
        icon = '🌦️';
        showRainEffect(true);
      } else {
        showRainEffect(false);
      }
      descEl.innerText = desc;
      iconEl.innerText = icon;
    }

    function showRainEffect(enable) {
      const rainLayer = document.getElementById('rain-layer');
      rainLayer.innerHTML = '';
      if (enable) {
        rainLayer.classList.remove('hidden');
        for (let i = 0; i < 40; i++) {
          const drop = document.createElement('div');
          drop.className = 'rain-drop';
          drop.style.left = `${Math.random() * 100}%`;
          drop.style.animationDuration = `${0.6 + Math.random() * 0.5}s`;
          drop.style.animationDelay = `${Math.random() * 2}s`;
          rainLayer.appendChild(drop);
        }
      } else {
        rainLayer.classList.add('hidden');
      }
    }

    function updateSkyBackground(isDay, code) {
      const container = document.getElementById('sky-canvas-container');
      const celestial = document.getElementById('celestial-graphic');
      const hour = new Date().getHours();

      if (!isDay || hour < 5 || hour >= 18) {
        container.style.background = 'linear-gradient(to bottom, #1e293b 0%, #334155 45%, #475569 100%)';
        celestial.innerText = '🌙';
        celestial.className = 'w-12 h-12 rounded-full bg-amber-100 shadow-[0_0_20px_rgba(254,243,199,0.7)] flex items-center justify-center text-xl';
      } else if (hour >= 16 && hour < 18) {
        container.style.background = 'linear-gradient(to bottom, #fdba74 0%, #fed7aa 40%, #e0e7ff 100%)';
        celestial.innerText = '🌇';
      } else if (code >= 51) {
        container.style.background = 'linear-gradient(to bottom, #94a3b8 0%, #cbd5e1 50%, #e2e8f0 100%)';
        celestial.innerText = '🌧️';
      } else {
        applyDefaultDaySky();
      }
    }

    function applyDefaultDaySky() {
      const container = document.getElementById('sky-canvas-container');
      container.style.background = 'linear-gradient(to bottom, #7dd3fc 0%, #bae6fd 45%, #ecfccb 100%)';
    }

    function getFilteredStudents() {
      const search = document.getElementById('team-search-input').value.trim().toLowerCase();
      return ALL_STUDENTS.filter(s => {
        const matchGrade = (selectedGrade === 'ALL' || s.grade === selectedGrade);
        const matchSearch = s.name.toLowerCase().includes(search) || (s.id && s.id.toLowerCase().includes(search));
        return matchGrade && matchSearch;
      });
    }

    function renderTeamView() {
      const list = getFilteredStudents();
      const totalStudents = list.length;
      const certifiedStudents = list.filter(s => s.certs && s.certs.length > 0).length;
      const totalCerts = list.reduce((sum, s) => sum + (s.certs ? s.certs.length : 0), 0);

      document.getElementById('current-filter-title').innerText = selectedGrade === 'ALL' ? '全體學生考照動態' : `${selectedGrade} 考照動態`;
      document.getElementById('stat-total-students').innerText = totalStudents;
      document.getElementById('stat-certified-students').innerText = certifiedStudents;
      document.getElementById('stat-total-certs').innerText = totalCerts;

      renderTeamPins(list);
      renderTeamRoster(list);
    }

    function renderTeamPins(list) {
      const layer = document.getElementById('team-pins-layer');
      layer.innerHTML = '';

      list.forEach(st => {
        const certCount = st.certs ? st.certs.length : 0;
        const altitude = calculateStudentAltitude(st.certs);
        const ratio = altitude / 3952;
        
        const jitter = ((st.name.charCodeAt(0) * 19) % 70) - 35;
        const topY = 510 - ratio * (510 - 95);
        const baseX = 415 + Math.sin(ratio * Math.PI * 2.3) * 150;
        const leftX = Math.max(70, Math.min(730, baseX + jitter));

        const conf = GRADE_COLORS[st.grade] || { badge: 'bg-slate-700', shirt: '#64748b' };
        const isFemale = (st.name.charCodeAt(st.name.length - 1) % 2 === 0);
        const figureHtml = createFigureSVG(isFemale ? 'female' : 'male', conf.shirt);

        const pin = document.createElement('div');
        pin.className = 'absolute pointer-events-auto cursor-pointer transform -translate-x-1/2 -translate-y-full hover:scale-130 transition-transform duration-200 z-10 select-none';
        pin.style.left = `${leftX}px`;
        pin.style.top = `${topY}px`;
        pin.onclick = () => openStudentModal(st);

        pin.innerHTML = `
          <div class="flex flex-col items-center">
            <div class="px-1.5 py-0.2 rounded-full text-[9px] font-black text-white shadow-xs whitespace-nowrap mb-0.5 ${conf.badge}">
              ${st.name} ${certCount > 0 ? `(${certCount})` : ''}
            </div>
            ${figureHtml}
          </div>
        `;
        layer.appendChild(pin);
      });
    }

    function renderTeamRoster(list) {
      const container = document.getElementById('team-roster-list');
      container.innerHTML = '';

      list.sort((a, b) => {
        const countA = a.certs ? a.certs.length : 0;
        const countB = b.certs ? b.certs.length : 0;
        if (countB !== countA) return countB - countA;
        return calculateStudentAltitude(b.certs) - calculateStudentAltitude(a.certs);
      });

      if (list.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-xs text-slate-400">查無學生資料</div>`;

          </div>
        `;
        container.appendChild(card);
      });
    }

    // Modal
    function openStudentModal(student) {
      const modal = document.getElementById('student-modal');
      const certCount = student.certs ? student.certs.length : 0;
      const altitude = calculateStudentAltitude(student.certs);

      document.getElementById('modal-student-name').innerText = student.name;
      document.getElementById('modal-student-grade').innerText = student.grade || '未設定';
      document.getElementById('modal-student-id').innerText = `學號：${student.id || '未設定'}`;
      document.getElementById('modal-student-altitude').innerText = `${altitude.toLocaleString()} m`;
      document.getElementById('modal-student-count').innerText = `${certCount} 張`;

      const certsContainer = document.getElementById('modal-student-certs');
      certsContainer.innerHTML = '';

      if (certCount === 0) {
        certsContainer.innerHTML = `<div class="p-6 text-center text-slate-400 bg-slate-50 rounded-xl">尚無考取紀錄，在登山口整裝待發！</div>`;
      } else {
        student.certs.forEach(c => {
          const meters = getCertPoints(c.name);
          const item = document.createElement('div');
          item.className = 'p-2.5 bg-slate-50 rounded-xl border border-slate-200/80 flex items-center justify-between';
          item.innerHTML = `
            <div class="min-w-0 pr-2">
              <p class="font-bold text-slate-700 truncate">${c.name}</p>
              <p class="text-[10px] text-slate-400">考取日期：${c.date || '無紀錄'}</p>
            </div>
            <span class="px-2 py-0.5 bg-amber-50 text-amber-700 font-black rounded-lg text-[10px] whitespace-nowrap">+${meters} m</span>
          `;
          certsContainer.appendChild(item);
        });
      }

      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeStudentModal() {
      document.getElementById('student-modal').classList.add('hidden');
    }

    // 頁面初始化
    window.addEventListener('DOMContentLoaded', () => {
      renderGradeSummaryCards();
      renderTeamView();
      fetchJiaoxiWeather();
      startDirectorPatrol();
      lucide.createIcons();
      
      // 自動連動 Google 試算表最新證照名冊
      fetchLiveDataFromGoogleSheet();
    });
  </script>
</body>
</html>
