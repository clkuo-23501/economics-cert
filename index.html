<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>經濟系考照百岳修煉圖・宜蘭礁溪即時連動版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif; }
    
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* 雨滴動畫 */
    .rain-drop {
      position: absolute;
      background: linear-gradient(transparent, rgba(255, 255, 255, 0.7));
      width: 1.5px;
      height: 14px;
      animation: fall linear infinite;
      pointer-events: none;
    }
    @keyframes fall {
      0% { transform: translateY(-20px) translateX(0); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(540px) translateX(-20px); opacity: 0.2; }
    }

    /* 主任打氣氣泡緩慢浮動 */
    @keyframes bubbleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .speech-bubble {
      animation: bubbleFloat 4s ease-in-out infinite;
    }

    /* 人物小人踏步微擺動 */
    @keyframes walkBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    .char-figure {
      animation: walkBounce 2.5s ease-in-out infinite;
    }

    /* 手繪山岳筆觸 */
    .crayon-style {
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body class="bg-[#fcfaf7] text-slate-800 min-h-screen flex flex-col">

  <!-- 頂部導航列 -->
  <header class="bg-white/90 backdrop-blur-md border-b border-amber-100 sticky top-0 z-40 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-amber-500 text-white flex items-center justify-center font-black text-xl shadow-inner">
          ⛰️
        </div>
        <div>
          <h1 class="font-black text-lg md:text-xl text-slate-800 tracking-tight leading-tight flex items-center gap-1.5">
            經濟百岳修煉圖
            <span class="text-xs font-bold px-2 py-0.5 bg-amber-100 text-amber-800 rounded-full">宜蘭礁溪天氣實況</span>
          </h1>
          <p class="text-xs text-slate-400 hidden sm:block">佛光大學應用經濟學系・公仔人物手繪風登山大隊</p>
        </div>
      </div>

      <!-- 右側資訊：雲端同步狀態與礁溪天氣 -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        <div id="sync-status" class="hidden sm:flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-[11px] font-bold">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>雲端已自動連動</span>
        </div>

        <div class="flex items-center space-x-2 bg-amber-50/80 border border-amber-200/60 px-3 py-1.5 rounded-2xl">
          <span id="weather-icon" class="text-xl">🌤️</span>
          <div class="text-left text-xs leading-tight">
            <p class="font-black text-slate-700" id="weather-temp">宜蘭礁溪 --°C</p>
            <p class="text-[10px] text-amber-700 font-medium" id="weather-desc">連線天氣中...</p>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">

    <!-- 年級狀態切換卡片列 -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3" id="grade-summary-cards"></div>

    <!-- 控制列：統計摘要與姓名學號搜尋 -->
    <div class="bg-white rounded-2xl p-4 border border-amber-100 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center space-x-2 text-xs text-slate-500">
        <span class="font-bold text-slate-800" id="current-filter-title">全體學生狀態</span>
        <span>・共 <b id="stat-total-students" class="text-blue-600">0</b> 人</span>
        <span>・已考取 <b id="stat-certified-students" class="text-emerald-600">0</b> 人</span>
        <span>・累計考取 <b id="stat-total-certs" class="text-amber-600">0</b> 張</span>
      </div>

      <div class="flex items-center space-x-2 w-full sm:w-auto">
        <div class="relative w-full sm:w-64">
          <input type="text" id="team-search-input" oninput="renderTeamView()" placeholder="搜尋姓名或學號..." class="w-full pl-8 pr-3 py-1.5 bg-amber-50/40 border border-amber-200/80 rounded-xl text-xs outline-none focus:bg-white focus:ring-2 focus:ring-amber-500">
          <i data-lucide="search" class="w-3.5 h-3.5 text-amber-400 absolute left-2.5 top-2.5"></i>
        </div>
        <button onclick="fetchLiveDataFromGoogleSheet(true)" title="立即從試算表重新整理" class="p-2 bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 rounded-xl transition flex items-center justify-center">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- 雙欄架構：左側手繪大山、右側排行榜 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- 左側：手繪水彩風格百岳全景圖 -->
      <div class="lg:col-span-8 bg-white rounded-3xl p-5 border border-amber-100 shadow-sm flex flex-col">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-black text-sm text-slate-800 flex items-center space-x-1.5">
            <span class="text-base">🥾</span>
            <span>公仔登山客・玉山即時動態（背景隨礁溪日照天色與天氣變換）</span>
          </h2>
          <div class="flex items-center space-x-2 text-[10px] text-slate-400">
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-purple-500"></span> 111級
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-blue-500"></span> 112級
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 113級
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-500"></span> 114級
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-pink-500"></span> 115級
          </div>
        </div>

        <!-- 畫布容器（天色背景隨時間漸層變化） -->
        <div id="sky-canvas-container" class="relative w-full h-[540px] rounded-2xl overflow-hidden border border-amber-200/80 shadow-inner transition-colors duration-1000">
          
          <!-- 動態雨滴圖層 -->
          <div id="rain-layer" class="absolute inset-0 pointer-events-none hidden"></div>

          <!-- 太陽 / 月亮 / 浮雲背景元素 -->
          <div id="celestial-body" class="absolute transition-all duration-1000" style="right: 50px; top: 40px;">
            <div id="celestial-graphic" class="w-14 h-14 rounded-full bg-amber-400 shadow-[0_0_30px_rgba(251,191,36,0.6)] flex items-center justify-center text-2xl">
              ☀️
            </div>
          </div>

          <!-- 手繪水彩山岳 SVG -->
          <svg class="w-full h-full crayon-style" viewBox="0 0 800 540" preserveAspectRatio="none">
            <!-- 遠景淡霧山巒 -->
            <path d="M 50,540 Q 200,320 350,330 T 650,280 T 800,400 L 800,540 Z" fill="#9dbfb1" opacity="0.4"/>
            <path d="M 0,540 Q 180,260 400,240 T 780,290 L 800,540 Z" fill="#7fa99b" opacity="0.5"/>

            <!-- 主峰山體（手繪圓潤山形） -->
            <path d="M 120,540 C 220,380 290,160 380,80 C 410,50 430,50 460,80 C 540,170 620,380 720,540 Z" fill="#4d7c66"/>
            
            <!-- 山腰植被與層次水彩點綴 -->
            <path d="M 210,480 C 270,390 320,260 380,180 C 410,140 430,140 460,180 C 510,250 560,390 630,480 Z" fill="#3b6552" opacity="0.85"/>
            
            <!-- 手繪白雪山帽 -->
            <path d="M 370,105 C 385,80 400,65 420,65 C 440,65 455,80 470,105 C 460,120 445,115 435,130 C 425,120 410,125 400,135 C 390,120 380,125 370,105 Z" fill="#ffffff" opacity="0.95"/>

            <!-- 山前圓潤矮丘 -->
            <path d="M 40,540 C 80,450 160,420 220,450 C 280,480 320,540 340,540 Z" fill="#88b04b" opacity="0.9"/>
            <path d="M 580,540 C 620,440 700,430 760,470 L 800,540 Z" fill="#c9a859" opacity="0.9"/>

            <!-- 手繪蜿蜒盤山山徑 -->
            <path id="real-mountain-path" d="M 240,510 Q 340,460 480,430 T 290,320 T 490,210 T 415,80" fill="none" stroke="#f6ecc9" stroke-width="8" stroke-dasharray="10,6" stroke-linecap="round"/>

            <!-- 營地標註線與地標 -->
            <line x1="80" y1="80" x2="720" y2="80" stroke="#f43f5e" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.6"/>
            <text x="95" y="75" font-size="12" font-weight="900" fill="#e11d48">🚩 玉山主峰頂 (3,952m)</text>

            <line x1="80" y1="210" x2="720" y2="210" stroke="#ea580c" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.6"/>
            <text x="95" y="205" font-size="11" font-weight="bold" fill="#c2410c">⛺ 排雲山莊 (3,402m)</text>

            <line x1="80" y1="320" x2="720" y2="320" stroke="#2563eb" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.6"/>
            <text x="95" y="315" font-size="11" font-weight="bold" fill="#1d4ed8">🌲 白木林觀景台 (2,700m)</text>

            <line x1="80" y1="430" x2="720" y2="430" stroke="#059669" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.6"/>
            <text x="95" y="425" font-size="11" font-weight="bold" fill="#047857">🛖 孟祿亭 (1,800m)</text>
          </svg>

          <!-- 學生公仔圖層 (無外框圓圈，純公仔立體小人) -->
          <div id="team-pins-layer" class="absolute inset-0 pointer-events-none"></div>

          <!-- 系主任慢速巡山 NPC -->
          <div id="director-npc" class="absolute pointer-events-auto cursor-pointer z-30" style="left: 420px; top: 230px; transform: translate(-50%, -100%); transition: left 4s ease-in-out, top 4s ease-in-out;">
            <!-- 主任打氣氣泡 -->
            <div class="speech-bubble relative -top-2 bg-amber-400 text-slate-900 text-[11px] font-black px-3 py-1.5 rounded-2xl shadow-lg border-2 border-white whitespace-nowrap">
              <span id="director-quote">今天礁溪天氣不錯，大家多考一張！</span>
              <div class="absolute -bottom-1.5 left-1/2 transform -translate-x-1/2 w-3 h-
