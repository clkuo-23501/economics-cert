<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>經濟百岳試煉島・FGU DAE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes islandFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .island-float { animation: islandFloat 7s ease-in-out infinite; }

    @keyframes balloonCruise {
      0% { transform: translate(660px, 400px) translateY(0); }
      25% { transform: translate(320px, 220px) translateY(-8px); }
      50% { transform: translate(1050px, 180px) translateY(0); }
      75% { transform: translate(1140px, 580px) translateY(-10px); }
      100% { transform: translate(660px, 400px) translateY(0); }
    }
    .balloon-route { animation: balloonCruise 48s ease-in-out infinite; }

    @keyframes campfireFlicker {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px rgba(249,115,22,0.8)); }
    }
    .campfire-glow { animation: campfireFlicker 1.8s ease-in-out infinite; }

    @keyframes bubbleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .speech-bubble { animation: bubbleFloat 4s ease-in-out infinite; }

    @keyframes walkBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    .char-figure { animation: walkBounce 2.5s ease-in-out infinite; }

    .viewport-grab { cursor: grab; }
    .viewport-grabbing { cursor: grabbing; user-select: none; }
  </style>
</head>
<body class="bg-[#f5ede2] text-slate-800 min-h-screen flex flex-col selection:bg-amber-200">

  <!-- 頂部導航列 -->
  <header class="bg-[#fbf7f0]/95 backdrop-blur-md border-b border-[#e8dccb] sticky top-0 z-40 shadow-xs">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 h-14 sm:h-16 flex items-center justify-between gap-2">
      <div class="flex items-center space-x-2 sm:space-x-3 min-w-0">
        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-2xl bg-[#608058] text-white flex items-center justify-center font-black text-base sm:text-xl shadow-inner shrink-0">
          🏝️
        </div>
        <div class="min-w-0">
          <h1 class="font-black text-sm sm:text-lg text-[#3d4a39] tracking-tight leading-tight truncate flex items-center gap-1.5">
            經濟百岳群島大平原
            <span class="text-[9px] sm:text-xs font-bold px-2 py-0.5 bg-[#e3ecd7] text-[#4d6a42] rounded-full shrink-0">全島同屏航海版</span>
          </h1>
          <p class="text-[10px] sm:text-xs text-[#8c8275] truncate">佛光大學應用經濟學系</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 shrink-0">
        <div class="flex items-center space-x-1.5 bg-[#eeddc8]/70 border border-[#ddcbb2] px-2.5 sm:px-3 py-1 rounded-2xl text-[10px] sm:text-xs">
          <span id="weather-icon" class="text-base sm:text-lg">🌤️</span>
          <div class="text-left leading-tight">
            <p class="font-black text-[#4b4033]" id="weather-temp">--°C</p>
            <p class="text-[8px] sm:text-[10px] text-[#7d6851] font-medium hidden sm:block" id="weather-desc">連線中</p>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 md:p-6 flex flex-col gap-4 sm:gap-6">

    <!-- 🧭 群島鏡頭快速鎖定導覽紐 -->
    <div class="bg-[#fbf7f0] rounded-2xl p-2 border border-[#e8dccb] shadow-xs flex items-center justify-between gap-1 overflow-x-auto no-scrollbar">
      <button onclick="focusIsland('overview')" id="btn-focus-overview" class="flex-1 min-w-[90px] py-1.5 px-2.5 rounded-xl font-black text-xs flex items-center justify-center space-x-1 transition-all bg-[#4b3c2c] text-white">
        <span>🗺️</span>
        <span>群島全覽</span>
      </button>
      <button onclick="focusIsland('main')" id="btn-focus-main" class="flex-1 min-w-[110px] py-1.5 px-2.5 rounded-xl font-bold text-xs flex items-center justify-center space-x-1 transition-all bg-[#608058] text-white shadow-xs">
        <span>🏔️</span>
        <span>玉山主島 (考照)</span>
      </button>
      <button onclick="focusIsland('training')" id="btn-focus-training" class="flex-1 min-w-[110px] py-1.5 px-2.5 rounded-xl font-bold text-xs flex items-center justify-center space-x-1 transition-all text-[#6d5b45] hover:bg-[#ede1d2]">
        <span>🧘</span>
        <span>備考練功島</span>
      </button>
      <button onclick="focusIsland('trial')" id="btn-focus-trial" class="flex-1 min-w-[110px] py-1.5 px-2.5 rounded-xl font-bold text-xs flex items-center justify-center space-x-1 transition-all text-[#6d5b45] hover:bg-[#ede1d2]">
        <span>⚔️</span>
        <span>實戰試煉島</span>
      </button>
      <button onclick="focusIsland('port')" id="btn-focus-port" class="flex-1 min-w-[110px] py-1.5 px-2.5 rounded-xl font-bold text-xs flex items-center justify-center space-x-1 transition-all text-[#6d5b45] hover:bg-[#ede1d2]">
        <span>🗼</span>
        <span>燈塔浮空港</span>
      </button>
    </div>

    <!-- 年級卡片列 -->
    <div class="flex overflow-x-auto no-scrollbar gap-2.5 sm:grid sm:grid-cols-3 lg:grid-cols-6 pb-1" id="grade-summary-cards"></div>

    <!-- 控制列：統計摘要與搜尋 -->
    <div class="bg-[#fbf7f0] rounded-2xl p-3 sm:p-4 border border-[#e8dccb] shadow-xs flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center justify-between w-full sm:w-auto text-xs text-[#706456] overflow-x-auto whitespace-nowrap">
        <span class="font-bold text-[#3d4a39]" id="current-filter-title">全體學生狀態</span>
        <div class="flex items-center space-x-2 ml-2">
          <span>・考取 <b id="stat-certified-students" class="text-[#4b7a42]">0</b> 人</span>
          <span>・總張數 <b id="stat-total-certs" class="text-[#b46b2b]">0</b> 張</span>
          <span>・備戰中 <b id="stat-training-count" class="text-amber-600">0</b> 人</span>
          <span>・職場體驗 <b id="stat-trial-count" class="text-blue-600">0</b> 人</span>
        </div>
      </div>

      <div class="flex items-center space-x-2 w-full sm:w-auto">
        <div class="relative w-full sm:w-64">
          <input type="text" id="team-search-input" oninput="renderAllLayers()" placeholder="搜尋學生姓名或學號..." class="w-full pl-8 pr-3 py-1.5 bg-[#f4ece1] border border-[#e0d2c0] rounded-xl text-xs outline-none focus:bg-white focus:ring-2 focus:ring-[#8fa878]">
          <i data-lucide="search" class="w-3.5 h-3.5 text-[#9e9080] absolute left-2.5 top-2.5"></i>
        </div>
        <button onclick="fetchLiveDataFromGoogleSheet(true)" title="重新整理試算表" class="p-2 bg-[#f4ece1] hover:bg-[#ede1d2] text-[#6d5b45] border border-[#e0d2c0] rounded-xl transition flex items-center justify-center shrink-0">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- 雙欄架構 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6">
      
      <!-- 左側：全景畫布 (1400 x 800) -->
      <div class="lg:col-span-8 bg-[#fbf7f0] rounded-3xl p-3 sm:p-5 border border-[#e8dccb] shadow-xs flex flex-col">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center space-x-2">
            <span class="text-base">🗺️</span>
            <h2 class="font-black text-xs sm:text-sm text-[#3d4a39]">群島全景大平原（滑鼠滾輪/雙指縮放，拖曳平移）</h2>
          </div>
          <span class="text-[10px] text-amber-800 font-bold bg-amber-100/80 px-2 py-0.5 rounded-full cursor-pointer hover:bg-amber-200" onclick="triggerBalloonViewSwitch()">
            🎈 點擊熱氣球巡弋跳轉
          </span>
        </div>

        <div id="sky-canvas-container" class="relative w-full h-[460px] sm:h-[540px] md:h-[600px] rounded-2xl overflow-hidden border border-[#decbb7] shadow-inner transition-colors duration-1000 viewport-grab">
          
          <div id="rain-layer" class="absolute inset-0 pointer-events-none hidden z-20"></div>
          
          <div id="celestial-body" class="absolute transition-all duration-1000 z-10 pointer-events-none" style="right: 35px; top: 25px;">
            <div id="celestial-graphic" class="w-10 h-10 sm:w-13 sm:h-13 rounded-full bg-[#fcd472] shadow-[0_0_20px_rgba(252,212,114,0.6)] flex items-center justify-center text-lg sm:text-xl">
              ☀️
            </div>
          </div>

          <div id="island-pan-zoom-stage" class="absolute left-0 top-0 w-[1400px] h-[800px] origin-top-left transition-transform duration-300 ease-out select-none">
            
            <svg class="w-full h-full" viewBox="0 0 1400 800" preserveAspectRatio="none">
              <defs>
                <linearGradient id="mainGrass" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#8bb777"/><stop offset="60%" stop-color="#678f54"/><stop offset="100%" stop-color="#4a6d3a"/>
                </linearGradient>
                <linearGradient id="earthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#a47754"/><stop offset="50%" stop-color="#7e5334"/><stop offset="100%" stop-color="#4e311d"/>
                </linearGradient>
                <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e2ecf2"/>
                </linearGradient>
              </defs>

              <!-- 索道吊橋 -->
              <path d="M 460,400 Q 380,340 330,280" fill="none" stroke="#b09e88" stroke-width="6" stroke-dasharray="8,5" stroke-linecap="round"/>
              <line x1="460" y1="400" x2="330" y2="280" stroke="#7d6b56" stroke-width="2" stroke-dasharray="3,3"/>

              <path d="M 940,390 Q 1010,320 1060,260" fill="none" stroke="#b09e88" stroke-width="6" stroke-dasharray="8,5" stroke-linecap="round"/>
              <line x1="940" y1="390" x2="1060" y2="260" stroke="#7d6b56" stroke-width="2" stroke-dasharray="3,3"/>

              <path d="M 920,490 Q 1030,520 1130,560" fill="none" stroke="#d5be9b" stroke-width="8" stroke-linecap="round"/>

              <!-- 1. 中央：玉山百岳島 -->
              <g class="island-float" id="svg-main-island">
                <ellipse cx="700" cy="580" rx="270" ry="24" fill="#4d3b2b" opacity="0.25"/>
                <path d="M 450,420 Q 480,545 700,560 Q 920,545 950,420 C 900,470 780,495 700,495 C 620,495 500,470 450,420 Z" fill="url(#earthGrad)"/>
                <ellipse cx="700" cy="425" rx="255" ry="75" fill="url(#mainGrass)"/>
                <path d="M 530,410 C 560,320 610,240 645,240 C 675,240 710,310 730,410 Z" fill="#587f4c" opacity="0.8"/>
                <path d="M 670,410 C 710,300 760,220 800,220 C 830,220 870,300 900,410 Z" fill="#537b46" opacity="0.75"/>
                <path d="M 510,420 C 590,320 650,150 695,95 C 705,85 715,85 725,95 C 770,150 830,320 910,420 Z" fill="#4d7240"/>
                <path d="M 695,95 C 715,85 725,95 740,150 C 770,230 800,320 835,420 C 775,430 710,430 680,420 C 665,330 680,210 695,95 Z" fill="#669152" opacity="0.7"/>
                <path d="M 670,135 C 685,110 695,90 710,90 C 725,90 735,110 750,135 C 740,150 730,145 720,160 C 710,150 695,155 685,165 C 680,150 675,155 670,135 Z" fill="url(#snowGrad)"/>
                <path d="M 560,445 Q 660,410 780,395 T 620,295 T 780,210 T 710,110" fill="none" stroke="#e8ded0" stroke-width="8" stroke-dasharray="10,6" stroke-linecap="round"/>
                <line x1="480" y1="110" x2="920" y2="110" stroke="#e16161" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.5"/>
                <text x="495" y="105" font-size="11" font-weight="900" fill="#c53b3b">🚩 玉山主峰頂 (3,952m)</text>
                <line x1="480" y1="210" x2="920" y2="210" stroke="#d97736" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.5"/>
                <text x="495" y="205" font-size="10" font-weight="bold" fill="#b45719">⛺ 排雲山莊 (3,402m)</text>
                <line x1="480" y1="295" x2="920" y2="295" stroke="#3d6c8f" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.5"/>
                <text x="495" y="290" font-size="10" font-weight="bold" fill="#2d5573">🌲 白木林觀景台 (2,700m)</text>
                <line x1="480" y1="395" x2="920" y2="395" stroke="#48783d" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.5"/>
                <text x="495" y="390" font-size="10" font-weight="bold" fill="#325e28">🛖 孟祿亭 (1,800m)</text>
              </g>

              <!-- 2. 左上角：備考練功島 -->
              <g class="island-float" id="svg-training-island" style="animation-delay: -2s;">
                <ellipse cx="260" cy="305" rx="160" ry="15" fill="#4d3b2b" opacity="0.2"/>
                <path d="M 120,230 Q 150,300 260,305 Q 370,300 400,230 C 360,265 290,280 260,280 C 230,280 160,265 120,230 Z" fill="#694d37"/>
                <ellipse cx="260" cy="225" rx="145" ry="50" fill="#68935a"/>
                <circle cx="210" cy="210" r="10" fill="#4a3322"/>
                <circle cx="210" cy="208" r="5" fill="#f97316" class="campfire-glow"/>
                <text x="180" y="190" font-size="10" font-weight="900" fill="#26401f">⛺ 銀行證券期貨營火</text>
                <circle cx="310" cy="210" r="10" fill="#4a3322"/>
                <circle cx="310" cy="208" r="5" fill="#f97316" class="campfire-glow"/>
                <text x="280" y="190" font-size="10" font-weight="900" fill="#26401f">📜 保險書閣</text>
                <circle cx="260" cy="245" r="10" fill="#4a3322"/>
                <circle cx="260" cy="243" r="5" fill="#f97316" class="campfire-glow"/>
                <text x="235" y="268" font-size="10" font-weight="900" fill="#26401f">🤖 AI研習亭</text>
                <text x="210" y="150" font-size="12" font-weight="900" fill="#3f2e1f">🧘 備考練功島</text>
              </g>

              <!-- 3. 右上角：實戰試煉島 -->
              <g class="island-float" id="svg-trial-island" style="animation-delay: -4s;">
                <ellipse cx="1120" cy="295" rx="170" ry="16" fill="#4d3b2b" opacity="0.2"/>
                <path d="M 970,220 Q 1010,290 1120,295 Q 1230,290 1270,220 C 1230,255 1160,270 1120,270 C 1080,270 1010,255 970,220 Z" fill="#6f4a30"/>
                <ellipse cx="1120" cy="220" rx="155" ry="52" fill="#759e66"/>
                <rect x="1030" y="150" width="40" height="35" rx="2" fill="#3b536b"/>
                <polygon points="1020,150 1050,130 1080,150" fill="#243444"/>
                <text x="1033" y="172" font-size="8" font-weight="900" fill="#ffffff">🏦 銀行</text>
                <rect x="1170" y="130" width="38" height="55" rx="2" fill="#2d4059"/>
                <rect x="1175" y="140" width="28" height="8" fill="#ef4444"/>
                <text x="1173" y="168" font-size="8" font-weight="900" fill="#ffffff">📈 證券</text>
                <path d="M 1045,210 Q 1060,195 1075,210 Z" fill="#d97706"/>
                <line x1="1060" y1="210" x2="1060" y2="230" stroke="#78350f" stroke-width="2"/>
                <text x="1042" y="242" font-size="8" font-weight="900" fill="#78350f">🛡️ 保險</text>
                <line x1="1185" y1="195" x2="1185" y2="230" stroke="#be123c" stroke-width="2"/>
                <circle cx="1185" cy="195" r="3" fill="#f43f5e"/>
                <text x="1170" y="242" font-size="8" font-weight="900" fill="#881337">⚡ 期貨</text>
                <text x="1070" y="115" font-size="12" font-weight="900" fill="#3f2e1f">⚔️ 實戰試煉島</text>
              </g>

              <!-- 4. 右下角：燈塔浮空港 -->
              <g class="island-float" id="svg-port-island" style="animation-delay: -1s;">
                <ellipse cx="1180" cy="650" rx="140" ry="14" fill="#4d3b2b" opacity="0.2"/>
                <path d="M 1060,580 Q 1090,645 1180,650 Q 1270,645 1300,580 C 1260,610 1210,625 1180,625 C 1150,625 1100,610 1060,580 Z" fill="#694d37"/>
                <ellipse cx="1180" cy="580" rx="125" ry="45" fill="#6a9662"/>
                <polygon points="1210,560 1230,560 1225,480 1215,480" fill="#ffffff"/>
                <polygon points="1212,540 1228,540 1226,520 1214,520" fill="#ef4444"/>
                <polygon points="1214,500 1226,500 1225,480 1215,480" fill="#ef4444"/>
                <circle cx="1220" cy="475" r="7" fill="#fde047" opacity="0.85"/>
                <text x="1145" y="520" font-size="12" font-weight="900" fill="#3f2e1f">🗼 燈塔浮空港</text>
              </g>
            </svg>

            <!-- 學生公仔與地標標籤圖層 -->
            <div id="island-pins-layer" class="absolute inset-0 pointer-events-none z-20"></div>

            <!-- 巡弋熱氣球 -->
            <div id="cruise-balloon" onclick="triggerBalloonViewSwitch()" class="absolute left-0 top-0 balloon-route pointer-events-auto cursor-pointer z-30 transition-transform duration-500 hover:scale-125" title="點擊熱氣球切換視角！">
              <div class="flex flex-col items-center">
                <div class="relative -top-1 bg-[#1e3a8a] text-amber-300 text-[8px] font-black px-1.5 py-0.5 rounded shadow-sm whitespace-nowrap">
                  🚩 FGU DAE
                  <div class="absolute -right-1 top-1 w-0 h-0 border-t-2 border-t-transparent border-b-2 border-b-transparent border-l-4 border-l-[#1e3a8a]"></div>
                </div>
                <svg width="40" height="52" viewBox="0 0 50 65" class="drop-shadow-lg">
                  <path d="M 25,2 C 10,2 2,15 2,26 C 2,36 12,46 20,50 L 30,50 C 38,46 48,36 48,26 C 48,15 40,2 25,2 Z" fill="#f97316"/>
                  <path d="M 25,2 C 18,2 14,15 14,26 C 14,36 18,46 22,50 L 28,50 C 32,46 36,36 36,26 C 36,15 32,2 25,2 Z" fill="#facc15"/>
                  <path d="M 25,2 C 22,2 20,15 20,26 C 20,36 22,46 23.5,50 L 26.5,50 C 28,46 30,36 30,26 C 30,15 28,2 25,2 Z" fill="#ffffff"/>
                  <line x1="21" y1="50" x2="21" y2="56" stroke="#451a03" stroke-width="1.5"/>
                  <line x1="29" y1="50" x2="29" y2="56" stroke="#451a03" stroke-width="1.5"/>
                  <rect x="19" y="56" width="12" height="8" rx="2" fill="#78350f"/>
                </svg>
              </div>
            </div>

            <!-- 系主任巡島 NPC -->
            <div id="director-npc" class="absolute pointer-events-auto cursor-pointer z-30" style="left: 700px; top: 380px; transform: translate(-50%, -100%); transition: left 5s ease-in-out, top 5s ease-in-out;">
              <div class="speech-bubble relative -top-1.5 bg-[#fcd472] text-[#3c2a13] text-[9px] sm:text-[11px] font-black px-2.5 sm:px-3 py-1 rounded-2xl shadow-md border border-white whitespace-nowrap">
                <span id="director-quote">今天礁溪天氣不錯，大家多考一張！</span>
                <div class="absolute -bottom-1 left-1/2 transform -translate-x-1/2 w-2 h-2 bg-[#fcd472] rotate-45 border-r border-b border-white"></div>
              </div>
              <div class="flex flex-col items-center select-none">
                <svg width="34" height="52" viewBox="0 0 50 74" class="drop-shadow-md sm:w-[42px] sm:h-[62px]">
                  <path d="M 14,18 C 11,13 13,6 20,4 C 26,2 35,3 41,7 C 44,10 44,17 38,19 C 32,20 18,21 14,18 Z" fill="#1c1917"/>
                  <circle cx="28" cy="22" r="13" fill="#fed7aa"/>
                  <path d="M 17,14 Q 22,13 25,15" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round"/>
                  <path d="M 31,15 Q 34,13 39,14" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round"/>
                  <ellipse cx="21" cy="18" rx="2" ry="1.2" fill="#1c1917"/>
