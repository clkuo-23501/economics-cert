<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>經濟百岳全景群島生態・FGU DAE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body { font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes islandFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .island-float { animation: islandFloat 7s ease-in-out infinite; }

    @keyframes balloonCruise {
      0% { transform: translate(660px, 400px) translateY(0); }
      25% { transform: translate(320px, 220px) translateY(-8px); }
      50% { transform: translate(1050px, 180px) translateY(0); }
      75% { transform: translate(1140px, 580px) translateY(-10px); }
      100% { transform: translate(660px, 400px) translateY(0); }
    }
    .balloon-route { animation: balloonCruise 48s ease-in-out infinite; }

    @keyframes campfireFlicker {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px rgba(249,115,22,0.8)); }
    }
    .campfire-glow { animation: campfireFlicker 1.8s ease-in-out infinite; }

    @keyframes bubbleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .speech-bubble { animation: bubbleFloat 4s ease-in-out infinite; }

    @keyframes walkBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    .char-figure { animation: walkBounce 2.5s ease-in-out infinite; }

    .viewport-grab { cursor: grab; }
    .viewport-grabbing { cursor: grabbing; user-select: none; }
  </style>
</head>
<body class="bg-[#f5ede2] text-slate-800 min-h-screen flex flex-col selection:bg-amber-200">

  <!-- 頂部導航列 -->
  <header class="bg-[#fbf7f0]/95 backdrop-blur-md border-b border-[#e8dccb] sticky top-0 z-40 shadow-xs">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 h-14 sm:h-16 flex items-center justify-between gap-2">
      <div class="flex items-center space-x-2 sm:space-x-3 min-w-0">
        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-2xl bg-[#608058] text-white flex items-center justify-center font-black text-base sm:text-xl shadow-inner shrink-0">
          🏝️
        </div>
        <div class="min-w-0">
          <h1 class="font-black text-sm sm:text-lg text-[#3d4a39] tracking-tight leading-tight truncate flex items-center gap-1.5">
            經濟百岳群島大平原
            <span class="text-[9px] sm:text-xs font-bold px-2 py-0.5 bg-[#e3ecd7] text-[#4d6a42] rounded-full shrink-0">全島同屏航海版</span>
          </h1>
          <p class="text-[10px] sm:text-xs text-[#8c8275] truncate">佛光大學應用經濟學系・等角全景微縮生態</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 shrink-0">
        <div class="flex items-center space-x-1.5 bg-[#eeddc8]/70 border border-[#ddcbb2] px-2.5 sm:px-3 py-1 rounded-2xl text-[10px] sm:text-xs">
          <span id="weather-icon" class="text-base sm:text-lg">🌤️</span>
          <div class="text-left leading-tight">
            <p class="font-black text-[#4b4033]" id="weather-temp">--°C</p>
            <p class="text-[8px] sm:text-[10px] text-[#7d6851] font-medium hidden sm:block" id="weather-desc">連線中</p>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 md:p-6 flex flex-col gap-4 sm:gap-6">

    <!-- 🧭 群島鏡頭快速鎖定導覽紐 -->
    <div class="bg-[#fbf7f0] rounded-2xl p-2 border border-[#e8dccb] shadow-xs flex items-center justify-between gap-1 overflow-x-auto no-scrollbar">
      <button onclick="focusIsland('overview')" id="btn-focus-overview" class="flex-1 min-w-[90px] py-1.5 px-2.5 rounded-xl font-black text-xs flex items-center justify-center space-x-1 transition-all bg-[#4b3c2c] text-white">
        <span>🗺️</span>
        <span>群島全覽</span>
      </button>
      <button onclick="focusIsland('main')" id="btn-focus-main" class="flex-1 min-w-[110px] py-1.5 px-2.5 rounded-xl font-bold text-xs flex items-center justify-center space-x-1 transition-all bg-[#608058] text-white shadow-xs">
        <span>🏔️</span>
        <span>玉山主島 (考照)</span>
      </button>
      <button onclick="focusIsland('training')" id="btn-focus-training" class="flex-1 min-w-[110px] py-1.5 px-2.5 rounded-xl font-bold text-xs flex items-center justify-center space-x-1 transition-all text-[#6d5b45] hover:bg-[#ede1d2]">
        <span>🧘</span>
        <span>備考練功島</span>
      </button>
      <button onclick="focusIsland('trial')" id="btn-focus-trial" class="flex-1 min-w-[110px] py-1.5 px-2.5 rounded-xl font-bold text-xs flex items-center justify-center space-x-1 transition-all text-[#6d5b45] hover:bg-[#ede1d2]">
        <span>⚔️</span>
        <span>實戰試煉島</span>
      </button>
      <button onclick="focusIsland('port')" id="btn-focus-port" class="flex-1 min-w-[110px] py-1.5 px-2.5 rounded-xl font-bold text-xs flex items-center justify-center space-x-1 transition-all text-[#6d5b45] hover:bg-[#ede1d2]">
        <span>🗼</span>
        <span>燈塔浮空港</span>
      </button>
    </div>

    <!-- 年級卡片列 -->
    <div class="flex overflow-x-auto no-scrollbar gap-2.5 sm:grid sm:grid-cols-3 lg:grid-cols-6 pb-1" id="grade-summary-cards"></div>

    <!-- 控制列：統計摘要與搜尋 -->
    <div class="bg-[#fbf7f0] rounded-2xl p-3 sm:p-4 border border-[#e8dccb] shadow-xs flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center justify-between w-full sm:w-auto text-xs text-[#706456] overflow-x-auto whitespace-nowrap">
        <span class="font-bold text-[#3d4a39]" id="current-filter-title">全體學生狀態</span>
        <div class="flex items-center space-x-2 ml-2">
          <span>・考取 <b id="stat-certified-students" class="text-[#4b7a42]">0</b> 人</span>
          <span>・總張數 <b id="stat-total-certs" class="text-[#b46b2b]">0</b> 張</span>
          <span>・備戰中 <b id="stat-training-count" class="text-amber-600">0</b> 人</span>
          <span>・職場體驗 <b id="stat-trial-count" class="text-blue-600">0</b> 人</span>
        </div>
      </div>

      <div class="flex items-center space-x-2 w-full sm:w-auto">
        <div class="relative w-full sm:w-64">
          <input type="text" id="team-search-input" oninput="renderAllLayers()" placeholder="搜尋學生姓名或學號..." class="w-full pl-8 pr-3 py-1.5 bg-[#f4ece1] border border-[#e0d2c0] rounded-xl text-xs outline-none focus:bg-white focus:ring-2 focus:ring-[#8fa878]">
          <i data-lucide="search" class="w-3.5 h-3.5 text-[#9e9080] absolute left-2.5 top-2.5"></i>
        </div>
        <button onclick="fetchLiveDataFromGoogleSheet(true)" title="重新整理試算表" class="p-2 bg-[#f4ece1] hover:bg-[#ede1d2] text-[#6d5b45] border border-[#e0d2c0] rounded-xl transition flex items-center justify-center shrink-0">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- 雙欄架構 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6">
      
      <!-- 左側：全景畫布 (1400 x 800) -->
      <div class="lg:col-span-8 bg-[#fbf7f0] rounded-3xl p-3 sm:p-5 border border-[#e8dccb] shadow-xs flex flex-col">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center space-x-2">
            <span class="text-base">🗺️</span>
            <h2 class="font-black text-xs sm:text-sm text-[#3d4a39]">群島全景大平原（滑鼠滾輪/雙指縮放，拖曳平移）</h2>
          </div>
          <span class="text-[10px] text-amber-800 font-bold bg-amber-100/80 px-2 py-0.5 rounded-full cursor-pointer hover:bg-amber-200" onclick="triggerBalloonViewSwitch()">
            🎈 點擊熱氣球巡弋跳轉
          </span>
        </div>

        <div id="sky-canvas-container" class="relative w-full h-[460px] sm:h-[540px] md:h-[600px] rounded-2xl overflow-hidden border border-[#decbb7] shadow-inner transition-colors duration-1000 viewport-grab">
          
          <div id="rain-layer" class="absolute inset-0 pointer-events-none hidden z-20"></div>
          
          <div id="celestial-body" class="absolute transition-all duration-1000 z-10 pointer-events-none" style="right: 35px; top: 25px;">
            <div id="celestial-graphic" class="w-10 h-10 sm:w-13 sm:h-13 rounded-full bg-[#fcd472] shadow-[0_0_20px_rgba(252,212,114,0.6)] flex items-center justify-center text-lg sm:text-xl">
              ☀️
            </div>
          </div>

          <div id="island-pan-zoom-stage" class="absolute left-0 top-0 w-[1400px] h-[800px] origin-top-left transition-transform duration-300 ease-out select-none">
            
            <svg class="w-full h-full" viewBox="0 0 1400 800" preserveAspectRatio="none">
              <defs>
                <linearGradient id="mainGrass" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#8bb777"/><stop offset="60%" stop-color="#678f54"/><stop offset="100%" stop-color="#4a6d3a"/>
                </linearGradient>
                <linearGradient id="earthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#a47754"/><stop offset="50%" stop-color="#7e5334"/><stop offset="100%" stop-color="#4e311d"/>
                </linearGradient>
                <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e2ecf2"/>
                </linearGradient>
              </defs>

              <!-- 索道吊橋 -->
              <path d="M 460,400 Q 380,340 330,280" fill="none" stroke="#b09e88" stroke-width="6" stroke-dasharray="8,5" stroke-linecap="round"/>
              <line x1="460" y1="400" x2="330" y2="280" stroke="#7d6b56" stroke-width="2" stroke-dasharray="3,3"/>

              <path d="M 940,390 Q 1010,320 1060,260" fill="none" stroke="#b09e88" stroke-width="6" stroke-dasharray="8,5" stroke-linecap="round"/>
              <line x1="940" y1="390" x2="1060" y2="260" stroke="#7d6b56" stroke-width="2" stroke-dasharray="3,3"/>

              <path d="M 920,490 Q 1030,520 1130,560" fill="none" stroke="#d5be9b" stroke-width="8" stroke-linecap="round"/>

              <!-- 1. 中央：玉山百岳島 -->
              <g class="island-float" id="svg-main-island">
                <ellipse cx="700" cy="580" rx="270" ry="24" fill="#4d3b2b" opacity="0.25"/>
                <path d="M 450,420 Q 480,545 700,560 Q 920,545 950,420 C 900,470 780,495 700,495 C 620,495 500,470 450,420 Z" fill="url(#earthGrad)"/>
                <ellipse cx="700" cy="425" rx="255" ry="75" fill="url(#mainGrass)"/>
                <path d="M 530,410 C 560,320 610,240 645,240 C 675,240 710,310 730,410 Z" fill="#587f4c" opacity="0.8"/>
                <path d="M 670,410 C 710,300 760,220 800,220 C 830,220 870,300 900,410 Z" fill="#537b46" opacity="0.75"/>
                <path d="M 510,420 C 590,320 650,150 695,95 C 705,85 715,85 725,95 C 770,150 830,320 910,420 Z" fill="#4d7240"/>
                <path d="M 695,95 C 715,85 725,95 740,150 C 770,230 800,320 835,420 C 775,430 710,430 680,420 C 665,330 680,210 695,95 Z" fill="#669152" opacity="0.7"/>
                <path d="M 670,135 C 685,110 695,90 710,90 C 725,90 735,110 750,135 C 740,150 730,145 720,160 C 710,150 695,155 685,165 C 680,150 675,155 670,135 Z" fill="url(#snowGrad)"/>
                <path d="M 560,445 Q 660,410 780,395 T 620,295 T 780,210 T 710,110" fill="none" stroke="#e8ded0" stroke-width="8" stroke-dasharray="10,6" stroke-linecap="round"/>
                <line x1="480" y1="110" x2="920" y2="110" stroke="#e16161" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.5"/>
                <text x="495" y="105" font-size="11" font-weight="900" fill="#c53b3b">🚩 玉山主峰頂 (3,952m)</text>
                <line x1="480" y1="210" x2="920" y2="210" stroke="#d97736" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.5"/>
                <text x="495" y="205" font-size="10" font-weight="bold" fill="#b45719">⛺ 排雲山莊 (3,402m)</text>
                <line x1="480" y1="295" x2="920" y2="295" stroke="#3d6c8f" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.5"/>
                <text x="495" y="290" font-size="10" font-weight="bold" fill="#2d5573">🌲 白木林觀景台 (2,700m)</text>
                <line x1="480" y1="395" x2="920" y2="395" stroke="#48783d" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.5"/>
                <text x="495" y="390" font-size="10" font-weight="bold" fill="#325e28">🛖 孟祿亭 (1,800m)</text>
              </g>

              <!-- 2. 左上角：備考練功島 -->
              <g class="island-float" id="svg-training-island" style="animation-delay: -2s;">
                <ellipse cx="260" cy="305" rx="160" ry="15" fill="#4d3b2b" opacity="0.2"/>
                <path d="M 120,230 Q 150,300 260,305 Q 370,300 400,230 C 360,265 290,280 260,280 C 230,280 160,265 120,230 Z" fill="#694d37"/>
                <ellipse cx="260" cy="225" rx="145" ry="50" fill="#68935a"/>
                <circle cx="210" cy="210" r="10" fill="#4a3322"/>
                <circle cx="210" cy="208" r="5" fill="#f97316" class="campfire-glow"/>
                <text x="180" y="190" font-size="10" font-weight="900" fill="#26401f">⛺ 信託營火</text>
                <circle cx="310" cy="210" r="10" fill="#4a3322"/>
                <circle cx="310" cy="208" r="5" fill="#f97316" class="campfire-glow"/>
                <text x="280" y="190" font-size="10" font-weight="900" fill="#26401f">📜 證券書閣</text>
                <circle cx="260" cy="245" r="10" fill="#4a3322"/>
                <circle cx="260" cy="243" r="5" fill="#f97316" class="campfire-glow"/>
                <text x="235" y="268" font-size="10" font-weight="900" fill="#26401f">🤖 AI研習亭</text>
                <text x="210" y="150" font-size="12" font-weight="900" fill="#3f2e1f">🧘 備考練功島</text>
              </g>

              <!-- 3. 右上角：實戰試煉島 -->
              <g class="island-float" id="svg-trial-island" style="animation-delay: -4s;">
                <ellipse cx="1120" cy="295" rx="170" ry="16" fill="#4d3b2b" opacity="0.2"/>
                <path d="M 970,220 Q 1010,290 1120,295 Q 1230,290 1270,220 C 1230,255 1160,270 1120,270 C 1080,270 1010,255 970,220 Z" fill="#6f4a30"/>
                <ellipse cx="1120" cy="220" rx="155" ry="52" fill="#759e66"/>
                <rect x="1030" y="150" width="40" height="35" rx="2" fill="#3b536b"/>
                <polygon points="1020,150 1050,130 1080,150" fill="#243444"/>
                <text x="1033" y="172" font-size="8" font-weight="900" fill="#ffffff">🏦 銀行</text>
                <rect x="1170" y="130" width="38" height="55" rx="2" fill="#2d4059"/>
                <rect x="1175" y="140" width="28" height="8" fill="#ef4444"/>
                <text x="1173" y="168" font-size="8" font-weight="900" fill="#ffffff">📈 證券</text>
                <path d="M 1045,210 Q 1060,195 1075,210 Z" fill="#d97706"/>
                <line x1="1060" y1="210" x2="1060" y2="230" stroke="#78350f" stroke-width="2"/>
                <text x="1042" y="242" font-size="8" font-weight="900" fill="#78350f">🛡️ 保險</text>
                <line x1="1185" y1="195" x2="1185" y2="230" stroke="#be123c" stroke-width="2"/>
                <circle cx="1185" cy="195" r="3" fill="#f43f5e"/>
                <text x="1170" y="242" font-size="8" font-weight="900" fill="#881337">⚡ 期貨</text>
                <text x="1070" y="115" font-size="12" font-weight="900" fill="#3f2e1f">⚔️ 實戰試煉島</text>
              </g>

              <!-- 4. 右下角：燈塔浮空港 -->
              <g class="island-float" id="svg-port-island" style="animation-delay: -1s;">
                <ellipse cx="1180" cy="650" rx="140" ry="14" fill="#4d3b2b" opacity="0.2"/>
                <path d="M 1060,580 Q 1090,645 1180,650 Q 1270,645 1300,580 C 1260,610 1210,625 1180,625 C 1150,625 1100,610 1060,580 Z" fill="#694d37"/>
                <ellipse cx="1180" cy="580" rx="125" ry="45" fill="#6a9662"/>
                <polygon points="1210,560 1230,560 1225,480 1215,480" fill="#ffffff"/>
                <polygon points="1212,540 1228,540 1226,520 1214,520" fill="#ef4444"/>
                <polygon points="1214,500 1226,500 1225,480 1215,480" fill="#ef4444"/>
                <circle cx="1220" cy="475" r="7" fill="#fde047" opacity="0.85"/>
                <text x="1145" y="520" font-size="12" font-weight="900" fill="#3f2e1f">🗼 燈塔浮空港</text>
              </g>
            </svg>

            <!-- 學生公仔與地標標籤圖層 -->
            <div id="island-pins-layer" class="absolute inset-0 pointer-events-none z-20"></div>

            <!-- 巡弋熱氣球 -->
            <div id="cruise-balloon" onclick="triggerBalloonViewSwitch()" class="absolute left-0 top-0 balloon-route pointer-events-auto cursor-pointer z-30 transition-transform duration-500 hover:scale-125" title="點擊熱氣球切換視角！">
              <div class="flex flex-col items-center">
                <div class="relative -top-1 bg-[#1e3a8a] text-amber-300 text-[8px] font-black px-1.5 py-0.5 rounded shadow-sm whitespace-nowrap">
                  🚩 FGU DAE
                  <div class="absolute -right-1 top-1 w-0 h-0 border-t-2 border-t-transparent border-b-2 border-b-transparent border-l-4 border-l-[#1e3a8a]"></div>
                </div>
                <svg width="40" height="52" viewBox="0 0 50 65" class="drop-shadow-lg">
                  <path d="M 25,2 C 10,2 2,15 2,26 C 2,36 12,46 20,50 L 30,50 C 38,46 48,36 48,26 C 48,15 40,2 25,2 Z" fill="#f97316"/>
                  <path d="M 25,2 C 18,2 14,15 14,26 C 14,36 18,46 22,50 L 28,50 C 32,46 36,36 36,26 C 36,15 32,2 25,2 Z" fill="#facc15"/>
                  <path d="M 25,2 C 22,2 20,15 20,26 C 20,36 22,46 23.5,50 L 26.5,50 C 28,46 30,36 30,26 C 30,15 28,2 25,2 Z" fill="#ffffff"/>
                  <line x1="21" y1="50" x2="21" y2="56" stroke="#451a03" stroke-width="1.5"/>
                  <line x1="29" y1="50" x2="29" y2="56" stroke="#451a03" stroke-width="1.5"/>
                  <rect x="19" y="56" width="12" height="8" rx="2" fill="#78350f"/>
                </svg>
              </div>
            </div>

            <!-- 系主任巡島 NPC -->
            <div id="director-npc" class="absolute pointer-events-auto cursor-pointer z-30" style="left: 700px; top: 380px; transform: translate(-50%, -100%); transition: left 5s ease-in-out, top 5s ease-in-out;">
              <div class="speech-bubble relative -top-1.5 bg-[#fcd472] text-[#3c2a13] text-[9px] sm:text-[11px] font-black px-2.5 sm:px-3 py-1 rounded-2xl shadow-md border border-white whitespace-nowrap">
                <span id="director-quote">今天礁溪天氣不錯，大家多考一張！</span>
                <div class="absolute -bottom-1 left-1/2 transform -translate-x-1/2 w-2 h-2 bg-[#fcd472] rotate-45 border-r border-b border-white"></div>
              </div>
              <div class="flex flex-col items-center select-none">
                <svg width="34" height="52" viewBox="0 0 50 74" class="drop-shadow-md sm:w-[42px] sm:h-[62px]">
                  <path d="M 14,18 C 11,13 13,6 20,4 C 26,2 35,3 41,7 C 44,10 44,17 38,19 C 32,20 18,21 14,18 Z" fill="#1c1917"/>
                  <circle cx="28" cy="22" r="13" fill="#fed7aa"/>
                  <path d="M 17,14 Q 22,13 25,15" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round"/>
                  <path d="M 31,15 Q 34,13 39,14" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round"/>
                  <ellipse cx="21" cy="18" rx="2" ry="1.2" fill="#1c1917"/>
                  <ellipse cx="35" cy="18" rx="2" ry="1.2" fill="#1c1917"/>
                  <path d="M 23,26 Q 28,30 33,26" fill="none" stroke="#78350f" stroke-width="1.8" stroke-linecap="round"/>
                  <polygon points="25,35 31,35 28,42" fill="#1e3a8a"/>
                  <path d="M 18,35 C 16,36 15,48 15,53 L 41,53 C 41,48 40,36 38,35 L 32,45 L 24,45 Z" fill="#475569"/>
                  <rect x="19" y="53" width="7" height="14" rx="1.5" fill="#1e293b"/>
                  <rect x="30" y="53" width="7" height="14" rx="1.5" fill="#1e293b"/>
                </svg>
                <span class="mt-0.5 bg-[#3d4a39] text-[#fcd472] text-[8px] sm:text-[9px] px-2 py-0.2 rounded-full font-bold">系主任巡島</span>
              </div>
            </div>

          </div>
        </div>

        <div class="flex items-center justify-between text-[11px] text-[#8c8275] pt-2 px-1">
          <span>💡 提示：可用滑鼠滾輪/手勢自由縮放畫布，拖曳任意平移</span>
          <button onclick="resetStageTransform()" class="px-2.5 py-1 bg-[#ede1d2] hover:bg-[#e2d3c0] text-[#5e4b37] rounded-lg font-bold transition">
            重設視角居中
          </button>
        </div>
      </div>

      <!-- 右側：全島名冊排行榜 -->
      <div class="lg:col-span-4 bg-[#fbf7f0] rounded-3xl p-4 sm:p-5 border border-[#e8dccb] shadow-xs flex flex-col gap-3">
        <div class="flex items-center justify-between border-b border-[#ebdcc7] pb-2">
          <h2 class="font-black text-xs sm:text-sm text-[#3d4a39] flex items-center space-x-1.5">
            <span>🏆</span>
            <span id="roster-panel-title">百岳考照榮譽榜</span>
          </h2>
          <div class="flex items-center space-x-1 text-[10px]">
            <button onclick="switchRosterTab('climb')" id="tab-roster-climb" class="px-2 py-0.5 rounded font-black bg-[#608058] text-white">考照</button>
            <button onclick="switchRosterTab('training')" id="tab-roster-training" class="px-2 py-0.5 rounded font-bold bg-[#ede1d2] text-[#6d5b45]">練功</button>
            <button onclick="switchRosterTab('trial')" id="tab-roster-trial" class="px-2 py-0.5 rounded font-bold bg-[#ede1d2] text-[#6d5b45]">實戰</button>
          </div>
        </div>

        <div id="active-roster-list" class="custom-scroll max-h-[460px] sm:max-h-[520px] overflow-y-auto space-y-2 pr-1"></div>
      </div>
    </div>
  </main>

  <!-- 彈窗 Modal -->
  <div id="student-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#fbf7f0] w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl border border-[#decbb7] overflow-hidden max-h-[85vh] flex flex-col">
      <div class="p-4 sm:p-5 border-b border-[#ebdcc7] flex items-center justify-between bg-[#f4ece1] shrink-0">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl bg-[#eeddc8] text-[#5e4b37] flex items-center justify-center text-xl sm:text-2xl font-black shadow-inner" id="modal-avatar-box">
            🧗
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <h3 id="modal-student-name" class="font-black text-base sm:text-lg text-[#3d4a39]">學生姓名</h3>
              <span id="modal-student-grade" class="px-2 py-0.5 bg-[#e3ecd7] text-[#4d6a42] text-[10px] sm:text-xs font-bold rounded-full">112級</span>
            </div>
            <p id="modal-student-id" class="text-[10px] sm:text-xs text-[#8c8275] mt-0.5">學號：未設定</p>
          </div>
        </div>
        <button onclick="closeStudentModal()" class="w-8 h-8 rounded-full hover:bg-[#e4d6c4] flex items-center justify-center text-[#8c8275] hover:text-[#3d4a39] transition">✕</button>
      </div>

      <div class="p-4 sm:p-5 space-y-4 overflow-y-auto custom-scroll" id="modal-body-content"></div>

      <div class="p-3 sm:p-4 bg-[#f4ece1] border-t border-[#ebdcc7] text-right shrink-0">
        <button onclick="closeStudentModal()" class="w-full sm:w-auto px-4 py-2 bg-[#42392f] text-white rounded-xl text-xs font-bold hover:bg-[#2c241c] transition">關閉手冊</button>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyUJjAYpBxqx7CJHAEil7-BJtnU_4D9R0MS0Cli6SeNDxLeBp60PZ-L_nCii1breC22bQ/exec";

    // 關鍵修復：預設為空陣列！沒有人填就完全不顯示任何人
    let TRAINING_STUDENTS = [];
    let TRIAL_STUDENTS = [];

    // 縮放與平移引擎
    let stageScale = 1;
    let stagePanX = 0;
    let stagePanY = 0;
    let isDragging = false;
    let startX = 0, startY = 0;

    const viewport = document.getElementById('sky-canvas-container');
    const stage = document.getElementById('island-pan-zoom-stage');

    function applyStageTransform() {
      stage.style.transform = `translate(${stagePanX}px, ${stagePanY}px) scale(${stageScale})`;
    }

    function resetStageTransform() {
      const vpWidth = viewport.clientWidth;
      const vpHeight = viewport.clientHeight;
      stageScale = Math.min(vpWidth / 1400, vpHeight / 800) * 1.1;
      stagePanX = (vpWidth - 1400 * stageScale) / 2;
      stagePanY = (vpHeight - 800 * stageScale) / 2;
      applyStageTransform();
    }

    viewport.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - stagePanX;
      startY = e.clientY - stagePanY;
      viewport.classList.remove('viewport-grab');
      viewport.classList.add('viewport-grabbing');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      stagePanX = e.clientX - startX;
      stagePanY = e.clientY - startY;
      applyStageTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      viewport.classList.remove('viewport-grabbing');
      viewport.classList.add('viewport-grab');
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const newScale = Math.max(0.4, Math.min(2.5, stageScale * zoomFactor));
      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      stagePanX = mouseX - (mouseX - stagePanX) * (newScale / stageScale);
      stagePanY = mouseY - (mouseY - stagePanY) * (newScale / stageScale);
      stageScale = newScale;
      applyStageTransform();
    }, { passive: false });

    let touchStartX = 0, touchStartY = 0;
    viewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX - stagePanX;
        touchStartY = e.touches[0].clientY - stagePanY;
      }
    });

    viewport.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1) {
        stagePanX = e.touches[0].clientX - touchStartX;
        stagePanY = e.touches[0].clientY - touchStartY;
        applyStageTransform();
      }
    });

    function focusIsland(islandKey) {
      const vpWidth = viewport.clientWidth;
      const vpHeight = viewport.clientHeight;
      const targets = {
        overview: { x: 700, y: 400, scale: Math.min(vpWidth / 1400, vpHeight / 800) },
        main: { x: 700, y: 400, scale: 1.15 },
        training: { x: 260, y: 260, scale: 1.35 },
        trial: { x: 1120, y: 240, scale: 1.35 },
        port: { x: 1180, y: 580, scale: 1.35 }
      };

      const t = targets[islandKey] || targets.main;
      stageScale = t.scale;
      stagePanX = (vpWidth / 2) - (t.x * stageScale);
      stagePanY = (vpHeight / 2) - (t.y * stageScale);
      applyStageTransform();

      document.querySelectorAll('#btn-focus-overview, #btn-focus-main, #btn-focus-training, #btn-focus-trial, #btn-focus-port').forEach(btn => {
        btn.className = 'flex-1 min-w-[90px] py-1.5 px-2.5 rounded-xl font-bold text-xs flex items-center justify-center space-x-1 transition-all text-[#6d5b45] hover:bg-[#ede1d2]';
      });
      const activeBtn = document.getElementById(`btn-focus-${islandKey}`);
      if (activeBtn) activeBtn.className = 'flex-1 min-w-[90px] py-1.5 px-2.5 rounded-xl font-black text-xs flex items-center justify-center space-x-1 transition-all bg-[#608058] text-white shadow-xs';
    }

    const balloonViews = ['main', 'training', 'trial', 'port'];
    let currentBalloonIndex = 0;
    function triggerBalloonViewSwitch() {
      currentBalloonIndex = (currentBalloonIndex + 1) % balloonViews.length;
      focusIsland(balloonViews[currentBalloonIndex]);
    }

    function isTargetDateExpired(dateStr) {
      if (!dateStr) return false;
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      const parts = dateStr.replace(/-/g, '/').split('/');
      let year = parseInt(parts[0], 10);
      let month = parseInt(parts[1], 10);
      let day = parts[2] ? parseInt(parts[2], 10) : new Date(year, month, 0).getDate();
      const target = new Date(year, month - 1, day, 23, 59, 59);
      return now > target;
    }

    function getDaysRemaining(dateStr) {
      if (!dateStr) return null;
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      const parts = dateStr.replace(/-/g, '/').split('/');
      let year = parseInt(parts[0], 10);
      let month = parseInt(parts[1], 10);
      let day = parts[2] ? parseInt(parts[2], 10) : new Date(year, month, 0).getDate();
      const target = new Date(year, month - 1, day);
      return Math.ceil((target - now) / (1000 * 60 * 60 * 24));
    }

    function renderAllLayers() {
      const search = (document.getElementById('team-search-input').value || '').trim().toLowerCase();
      const layer = document.getElementById('island-pins-layer');
      layer.innerHTML = '';

      // 1. 百岳主島學生
      const climbStudents = ALL_STUDENTS.filter(s => {
        const matchGrade = (selectedGrade === 'ALL' || s.grade === selectedGrade);
        const matchSearch = s.name.toLowerCase().includes(search) || (s.id && s.id.toLowerCase().includes(search));
        return matchGrade && matchSearch;
      });

      climbStudents.forEach(st => {
        const certCount = st.certs ? st.certs.length : 0;
        const altitude = calculateStudentAltitude(st.certs);
        const ratio = altitude / 3952;

        const topY = 460 - ratio * (460 - 110);
        const baseX = 700 + Math.sin(ratio * Math.PI * 2.3) * 110;
        const jitter = ((st.name.charCodeAt(0) * 19) % 50) - 25;
        const leftX = baseX + jitter;

        const conf = GRADE_COLORS[st.grade] || { badge: 'bg-[#527e9b]', shirt: '#6593b2' };
        const isFemale = (st.name.charCodeAt(st.name.length - 1) % 2 === 0);

        const pin = document.createElement('div');
        pin.className = 'absolute pointer-events-auto cursor-pointer transform -translate-x-1/2 -translate-y-full hover:scale-130 transition-transform duration-200 z-10 select-none';
        pin.style.left = `${leftX}px`;
        pin.style.top = `${topY}px`;
        pin.onclick = () => openClimbStudentModal(st);

        pin.innerHTML = `
          <div class="flex flex-col items-center">
            <div class="px-1.5 py-0.2 rounded-full text-[9px] font-black text-white shadow-xs whitespace-nowrap mb-0.5 ${conf.badge}">
              ${st.name} ${certCount > 0 ? `(${certCount})` : ''}
            </div>
            ${createFigureSVG(isFemale ? 'female' : 'male', conf.shirt)}
          </div>
        `;
        layer.appendChild(pin);
      });

      // 2. 備考練功島學生 (過期不列出)
      const validTraining = TRAINING_STUDENTS.filter(s => !isTargetDateExpired(s.targetDate) && s.name.toLowerCase().includes(search));
      document.getElementById('stat-training-count').innerText = validTraining.length;

      validTraining.forEach((st, idx) => {
        let posX = 210, posY = 220;
        if (st.targetCert.includes('證券') || st.targetCert.includes('期貨')) { posX = 310; posY = 220; }
        else if (st.targetCert.includes('AI') || st.targetCert.includes('商務')) { posX = 260; posY = 255; }
        
        const pin = document.createElement('div');
        pin.className = 'absolute pointer-events-auto cursor-pointer transform -translate-x-1/2 -translate-y-full hover:scale-130 transition-transform duration-200 z-10 select-none';
        pin.style.left = `${posX + (idx * 12 % 24) - 12}px`;
        pin.style.top = `${posY + (idx * 8 % 16) - 8}px`;
        pin.onclick = () => openTrainingModal(st);

        const days = getDaysRemaining(st.targetDate);
        const isFemale = (st.name.charCodeAt(st.name.length - 1) % 2 === 0);

        pin.innerHTML = `
          <div class="flex flex-col items-center">
            <div class="px-1.5 py-0.2 rounded-full text-[9px] font-black text-white shadow-xs whitespace-nowrap mb-0.5 bg-amber-600">
              ${st.name}・${days !== null ? `剩${days}天` : '備戰'}
            </div>
            ${createFigureSVG(isFemale ? 'female' : 'male', '#d97706')}
          </div>
        `;
        layer.appendChild(pin);
      });

      // 3. 實戰試煉島學生
      const trialStudents = TRIAL_STUDENTS.filter(s => s.name.toLowerCase().includes(search));
      document.getElementById('stat-trial-count').innerText = trialStudents.length;

      trialStudents.forEach((st, idx) => {
        let posX = 1050, posY = 185;
        if (st.sector === '證券') { posX = 1190; posY = 180; }
        else if (st.sector === '保險') { posX = 1060; posY = 235; }
        else if (st.sector === '期貨') { posX = 1185; posY = 235; }

        const pin = document.createElement('div');
        pin.className = 'absolute pointer-events-auto cursor-pointer transform -translate-x-1/2 -translate-y-full hover:scale-130 transition-transform duration-200 z-10 select-none';
        pin.style.left = `${posX + (idx * 14 % 20) - 10}px`;
        pin.style.top = `${posY + (idx * 8 % 12) - 6}px`;
        pin.onclick = () => openTrialStudentModal(st);

        const isFemale = (st.name.charCodeAt(st.name.length - 1) % 2 === 0);
        pin.innerHTML = `
          <div class="flex flex-col items-center">
            <div class="px-1.5 py-0.2 rounded-full text-[9px] font-black text-white shadow-xs whitespace-nowrap mb-0.5 bg-blue-600">
              ${st.name}・${st.sector}
            </div>
            ${createFigureSVG(isFemale ? 'female' : 'male', '#2563eb')}
          </div>
        `;
        layer.appendChild(pin);
      });

      document.getElementById('stat-certified-students').innerText = climbStudents.filter(s => s.certs && s.certs.length > 0).length;
      document.getElementById('stat-total-certs').innerText = climbStudents.reduce((sum, s) => sum + (s.certs ? s.certs.length : 0), 0);

      renderActiveRoster();
    }

    function switchRosterTab(tab) {
      currentRosterTab = tab;
      document.querySelectorAll('#tab-roster-climb, #tab-roster-training, #tab-roster-trial').forEach(b => {
        b.className = 'px-2 py-0.5 rounded font-bold bg-[#ede1d2] text-[#6d5b45]';
      });
      document.getElementById(`tab-roster-${tab}`).className = 'px-2 py-0.5 rounded font-black bg-[#608058] text-white';
      
      const titles = {
        climb: '百岳考照榮譽榜',
        training: '備考同伴研討榜 (有效考期)',
        trial: '職場實習體驗榜'
      };
      document.getElementById('roster-panel-title').innerText = titles[tab];
      renderActiveRoster();
    }

    function renderActiveRoster() {
      const container = document.getElementById('active-roster-list');
      container.innerHTML = '';

      if (currentRosterTab === 'climb') {
        const list = [...ALL_STUDENTS].sort((a, b) => (b.certs ? b.certs.length : 0) - (a.certs ? a.certs.length : 0));
        list.forEach((st, idx) => {
          const certCount = st.certs ? st.certs.length : 0;
          const alt = calculateStudentAltitude(st.certs);
          const pct = Math.min(100, Math.round((alt / 3952) * 100));

          const card = document.createElement('div');
          card.className = 'p-2.5 bg-[#f4ece1]/80 border border-[#e8dccb] rounded-2xl hover:bg-[#ede1d2] transition cursor-pointer flex flex-col gap-1.5';
          card.onclick = () => openClimbStudentModal(st);
          card.innerHTML = `
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-2">
                <span class="w-4 text-center text-xs font-black ${idx < 3 ? 'text-[#b46b2b]' : 'text-[#9e9080]'}">${idx + 1}</span>
                <p class="text-xs font-bold text-[#3d4a39]">${st.name} <span class="text-[9px] text-[#8c8275]">(${st.grade})</span></p>
              </div>
              <span class="px-1.5 py-0.5 rounded-full text-[9px] font-bold bg-[#e3ecd7] text-[#4d6a42]">${certCount} 張・${alt}m</span>
            </div>
            <div class="w-full bg-[#ded0bf] h-1 rounded-full overflow-hidden">
              <div class="bg-gradient-to-r from-[#c78b43] to-[#5b8753] h-full" style="width: ${pct}%"></div>
            </div>
          `;
          container.appendChild(card);
        });
      } else if (currentRosterTab === 'training') {
        const validList = TRAINING_STUDENTS.filter(s => !isTargetDateExpired(s.targetDate));
        if (validList.length === 0) {
          container.innerHTML = `<p class="p-8 text-center text-xs text-[#8c8275] bg-white rounded-2xl border border-amber-100/60">目前尚無同學登記備考，快來登記第一個！</p>`;
          return;
        }
        validList.forEach(st => {
          const days = getDaysRemaining(st.targetDate);
          const card = document.createElement('div');
          card.className = 'p-2.5 bg-white border border-amber-100 rounded-2xl hover:border-amber-300 transition cursor-pointer flex flex-col gap-1';
          card.onclick = () => openTrainingModal(st);
          card.innerHTML = `
            <div class="flex items-center justify-between">
              <p class="text-xs font-bold text-slate-800">${st.name} <span class="text-[10px] text-amber-700 font-bold ml-1">${st.targetCert}</span></p>
              <span class="text-[9px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full">${days !== null ? `剩 ${days} 天` : '衝刺'}</span>
            </div>
            <p class="text-[10px] text-slate-500 truncate italic">“${st.location || '研討刷題中'}”</p>
          `;
          container.appendChild(card);
        });
      } else if (currentRosterTab === 'trial') {
        if (TRIAL_STUDENTS.length === 0) {
          container.innerHTML = `<p class="p-8 text-center text-xs text-[#8c8275] bg-white rounded-2xl border border-amber-100/60">目前尚無職場體驗實習名冊登記</p>`;
          return;
        }
        TRIAL_STUDENTS.forEach(st => {
          const card = document.createElement('div');
          card.className = 'p-2.5 bg-white border border-amber-100 rounded-2xl hover:border-amber-300 transition cursor-pointer flex flex-col gap-1';
          card.onclick = () => openTrialStudentModal(st);
          card.innerHTML = `
            <div class="flex items-center justify-between">
              <p class="text-xs font-bold text-slate-800">${st.name} <span class="text-[10px] text-blue-600 font-bold ml-1">${st.sector}</span></p>
              <span class="text-[9px] font-bold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-full">${st.role || '實習生'}</span>
            </div>
            <p class="text-[10px] text-slate-500 truncate">${st.company}</p>
          `;
          container.appendChild(card);
        });
      }
    }

    let directorWaypointIdx = 0;
    function startDirectorPatrol() {
      const director = document.getElementById('director-npc');
      const quoteEl = document.getElementById('director-quote');

      setInterval(() => {
        directorWaypointIdx = (directorWaypointIdx + 1) % DIRECTOR_PATROL_WAYPOINTS.length;
        const pt = DIRECTOR_PATROL_WAYPOINTS[directorWaypointIdx];
        director.style.left = `${pt.x}px`;
        director.style.top = `${pt.y}px`;
        quoteEl.innerText = pt.quote;
      }, 15000);
    }

    function openClimbStudentModal(st) {
      const modal = document.getElementById('student-modal');
      const certCount = st.certs ? st.certs.length : 0;
      const alt = calculateStudentAltitude(st.certs);

      document.getElementById('modal-avatar-box').innerText = '🧗';
      document.getElementById('modal-student-name').innerText = st.name;
      document.getElementById('modal-student-grade').innerText = `${st.grade}・玉山主島修煉`;
      document.getElementById('modal-student-id').innerText = `學號：${st.id}`;

      const content = document.getElementById('modal-body-content');
      content.innerHTML = `
        <div class="grid grid-cols-2 gap-2 bg-[#f2e7d8]/60 p-3 rounded-2xl border border-[#ded0bf] text-center">
          <div><span class="text-[10px] text-[#8c8275]">攀登海拔</span><p class="text-xl font-black text-[#3d6c8f]">${alt.toLocaleString()} m</p></div>
          <div><span class="text-[10px] text-[#8c8275]">考取證照</span><p class="text-xl font-black text-[#4d7a42]">${certCount} 張</p></div>
        </div>
        <div class="space-y-1.5 max-h-52 overflow-y-auto custom-scroll" id="modal-certs-list"></div>
      `;

      const listEl = document.getElementById('modal-certs-list');
      if (certCount === 0) {
        listEl.innerHTML = `<p class="p-3 bg-white rounded-xl text-center text-xs text-slate-400">登山口蓄勢待發</p>`;
      } else {
        st.certs.forEach(c => {
          listEl.innerHTML += `
            <div class="p-2 bg-white rounded-xl border border-[#ebdcc7] flex justify-between items-center text-xs">
              <span class="font-bold text-slate-700 truncate">${c.name}</span>
              <span class="px-1.5 py-0.5 rounded bg-amber-50 text-amber-700 font-bold">+${getCertPoints(c.name)}m</span>
            </div>
          `;
        });
      }
      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function openTrainingModal(st) {
      const modal = document.getElementById('student-modal');
      const days = getDaysRemaining(st.targetDate);

      document.getElementById('modal-avatar-box').innerText = '🔥';
      document.getElementById('modal-student-name').innerText = st.name;
      document.getElementById('modal-student-grade').innerText = `${st.grade}・熱烈備戰中`;
      document.getElementById('modal-student-id').innerText = `學號：${st.id}`;

      document.getElementById('modal-body-content').innerHTML = `
        <div class="bg-white p-4 rounded-2xl border border-amber-100 space-y-2.5 shadow-2xs text-xs">
          <div><span class="text-[10px] font-bold text-slate-400 uppercase">目標攻克證照</span><p class="font-bold text-sm text-amber-700 mt-0.5">${st.targetCert}</p></div>
          <div class="flex justify-between items-baseline pt-1 border-t border-slate-100">
            <div><span class="text-[10px] font-bold text-slate-400 uppercase">預計考期</span><p class="font-bold text-slate-700 mt-0.5">${st.targetDate}</p></div>
            <span class="px-2.5 py-1 bg-amber-100 text-amber-800 font-black rounded-lg text-xs">${days !== null ? `倒數 ${days} 天` : '衝刺中'}</span>
          </div>
        </div>
        <div class="bg-amber-50/70 p-4 rounded-2xl border border-amber-200/70 text-xs">
          <h5 class="font-bold text-amber-900 mb-1 flex items-center space-x-1"><span>📍</span><span>常駐研習地點與揪團備忘</span></h5>
          <p class="text-amber-800 leading-relaxed italic">“${st.location || '歡迎同路人隨時相約系圖書館或自習室研討刷題！'}”</p>
        </div>
      `;
      modal.classList.remove('hidden');
    }

    function openTrialStudentModal(st) {
      const modal = document.getElementById('student-modal');
      document.getElementById('modal-avatar-box').innerText = '💼';
      document.getElementById('modal-student-name').innerText = st.name;
      document.getElementById('modal-student-grade').innerText = `${st.grade}・${st.sector}試煉中`;
      document.getElementById('modal-student-id').innerText = `學號：${st.id}`;

      document.getElementById('modal-body-content').innerHTML = `
        <div class="bg-white p-4 rounded-2xl border border-amber-100 space-y-2.5 shadow-2xs text-xs">
          <div><span class="text-[10px] font-bold text-slate-400 uppercase">職場實習機構</span><p class="font-bold text-sm text-slate-800 mt-0.5">${st.company}</p></div>
          <div><span class="text-[10px] font-bold text-slate-400 uppercase">實習參與職務</span><p class="font-bold text-slate-700 mt-0.5">${st.role || '實習生'}</p></div>
          ${st.period ? `<div><span class="text-[10px] font-bold text-slate-400 uppercase">實習期間</span><p class="font-medium text-slate-600 mt-0.5">${st.period}</p></div>` : ''}
        </div>
        <div class="bg-amber-50/60 p-4 rounded-2xl border border-amber-200/60 text-xs">
          <h5 class="font-bold text-amber-900 mb-1 flex items-center space-x-1"><span>💬</span><span>學長姐實戰心得與心法</span></h5>
          <p class="text-amber-800 leading-relaxed italic">“${st.quote || '用心體驗職場，提早累積專業實力！'}”</p>
        </div>
      `;
      modal.classList.remove('hidden');
    }

    function closeStudentModal() {
      document.getElementById('student-modal').classList.add('hidden');
    }

    // 關鍵更新：以 Google 試算表實際資料為準，即使為空也直接同步為空
    async function fetchLiveDataFromGoogleSheet(isManual = false) {
      try {
        const res = await fetch(GOOGLE_SHEET_API_URL);
        const liveData = await res.json();
        
        if (liveData && typeof liveData === 'object') {
          if (Array.isArray(liveData.climb)) ALL_STUDENTS = liveData.climb;
          // 以試算表實際回傳為準，空的就是 []
          TRAINING_STUDENTS = Array.isArray(liveData.training) ? liveData.training : [];
          TRIAL_STUDENTS = Array.isArray(liveData.trial) ? liveData.trial : [];
        } else if (Array.isArray(liveData)) {
          ALL_STUDENTS = liveData;
          TRAINING_STUDENTS = [];
          TRIAL_STUDENTS = [];
        }

        renderGradeSummaryCards();
        renderAllLayers();
        if (isManual) alert(`同步成功！已成功連動全系最新資料！`);
      } catch (err) {
        console.warn("無法取得遠端試算表資料");
      }
    }

    async function fetchJiaoxiWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=24.82&longitude=121.77&current_weather=true&timezone=Asia%2FTaipei');
        const data = await res.json();
        if (data && data.current_weather) {
          const temp = Math.round(data.current_weather.temperature);
          const isDay = data.current_weather.is_day;
          document.getElementById('weather-temp').innerText = `${temp}°C`;
          document.getElementById('weather-desc').innerText = isDay ? '礁溪晴朗' : '礁溪星空';
          document.getElementById('weather-icon').innerText = isDay ? '☀️' : '🌙';
          const container = document.getElementById('sky-canvas-container');
          const celestial = document.getElementById('celestial-graphic');
          if (!isDay) {
            container.style.background = 'linear-gradient(to bottom, #1f2839 0%, #2b394f 45%, #415570 100%)';
            celestial.innerText = '🌙';
          } else {
            container.style.background = 'linear-gradient(to bottom, #8ec7d2 0%, #bae2e8 45%, #edf3e4 100%)';
          }
        }
      } catch (e) {}
    }

    function renderGradeSummaryCards() {
      const container = document.getElementById('grade-summary-cards');
      container.innerHTML = '';
      const grades = ['ALL', '111級', '112級', '113級', '114級', '115級'];

      grades.forEach(g => {
        const list = g === 'ALL' ? ALL_STUDENTS : ALL_STUDENTS.filter(s => s.grade === g);
        const total = list.length;
        const certified = list.filter(s => s.certs && s.certs.length > 0).length;
        const totalCerts = list.reduce((sum, s) => sum + (s.certs ? s.certs.length : 0), 0);
        const isCurrent = selectedGrade === g;

        const card = document.createElement('div');
        card.className = `p-2.5 sm:p-3.5 rounded-2xl border transition-all cursor-pointer flex flex-col justify-between shrink-0 w-28 sm:w-auto ${
          isCurrent ? 'bg-[#608058] text-white shadow-md border-[#608058]' : 'bg-[#fbf7f0] text-[#4b4033] border-[#e8dccb]'
        }`;
        card.onclick = () => { selectedGrade = g; renderGradeSummaryCards(); renderAllLayers(); };

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-0.5 sm:mb-1">
              <span class="font-black text-xs sm:text-sm truncate">${g === 'ALL' ? '🌟全系' : g}</span>
              <span class="text-[9px] font-bold px-1.5 py-0.2 rounded ${isCurrent ? 'bg-white/20 text-white' : 'bg-[#eeddc8] text-[#5e4b37]'}">${total}</span>
            </div>
            <p class="text-[9px] sm:text-[11px] ${isCurrent ? 'text-[#dbe8d5]' : 'text-[#8c8275]'}">已考: <b>${certified}人</b></p>
          </div>
          <div class="mt-1.5 pt-1.5 border-t ${isCurrent ? 'border-white/20' : 'border-[#ebdcc7]'} flex items-baseline justify-between text-[10px] sm:text-[11px]">
            <span class="${isCurrent ? 'text-[#dbe8d5]' : 'text-[#8c8275]'}">總張數</span>
            <span class="font-black text-xs sm:text-sm">${totalCerts}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      resetStageTransform();
      renderGradeSummaryCards();
      renderAllLayers();
      fetchJiaoxiWeather();
      startDirectorPatrol();
      fetchLiveDataFromGoogleSheet();
      lucide.createIcons();
    });

    window.addEventListener('resize', () => {
      resetStageTransform();
    });
  </script>
</body>
</html>
